<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hard-to-borrow shorting: prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #dde1e6;
  --panel: #ffffff;
  --ink: #111214;
  --muted: #6a7078;
  --line: #e6e8eb;
  --chip: #f1f2f4;
  --rail: #0e0f10;
  --dark: #131415;
  --dark-2: #232426;
  --dark-3: #2f3032;
  --dark-line: #2c2d2f;
  --on-dark: #f2f3f5;
  --on-dark-muted: #9a9ea4;
  --amber: #f2a900;
  --on-amber: #141414;
  --pos: #1a7f4b;
  --neg: #c4372b;
  --blue: #2f6bff;
  --warn-bg: #fff6e0;
  --warn-ink: #5a3d00;
  --bad-bg: #fdeceb;
  --bad-ink: #7a1f17;
  --shadow: 0 10px 40px rgba(10, 12, 16, 0.25);
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #09090a; --panel: #17181a; --ink: #f2f3f5; --muted: #9aa0a8; --line: #2a2c2f; --chip: #232528;
    --rail: #101112; --dark: #101112; --dark-2: #1d1e20; --dark-3: #2a2b2d; --dark-line: #2a2b2d;
    --warn-bg: #3a2e0c; --warn-ink: #ffe3a3; --bad-bg: #3b1613; --bad-ink: #ffc9c3; --pos: #4cc38a; --neg: #ff7a6e;
    --shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #09090a; --panel: #17181a; --ink: #f2f3f5; --muted: #9aa0a8; --line: #2a2c2f; --chip: #232528;
  --rail: #101112; --dark: #101112; --dark-2: #1d1e20; --dark-3: #2a2b2d; --dark-line: #2a2b2d;
  --warn-bg: #3a2e0c; --warn-ink: #ffe3a3; --bad-bg: #3b1613; --bad-ink: #ffc9c3; --pos: #4cc38a; --neg: #ff7a6e;
  --shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
* { box-sizing: border-box; }
body {
  margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 13px; line-height: 1.4; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

/* ---------- app shell ---------- */
.app { display: grid; grid-template-columns: 44px minmax(0, 1fr) 300px; gap: 10px; padding: 10px; min-height: 100vh; }
.rail { background: var(--rail); border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 14px 0; position: sticky; top: 10px; height: calc(100vh - 20px); }
.rail .group { display: flex; flex-direction: column; gap: 8px; align-items: center; }
.rail button { width: 28px; height: 28px; border-radius: 50%; border: 0; background: transparent; color: #aab0b6; display: grid; place-items: center; padding: 0; }
.rail button.active { background: #2a2c2e; color: #fff; }
.rail svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.main { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 10px; min-width: 0; align-items: start; }
.card { background: var(--panel); border-radius: 18px; padding: 16px; min-width: 0; }
.acct h4 { margin: 0; font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: 0.02em; display: flex; justify-content: space-between; }
.big { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; }
.big small { font-size: 18px; color: var(--muted); font-weight: 500; }
.kv { display: flex; justify-content: space-between; padding: 3px 0; color: var(--ink); }
.kv span:first-child { color: var(--ink); }
.sep { height: 1px; background: var(--line); margin: 12px 0; }
.tabs2 { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--line); margin: 10px 0; }
.tabs2 div { text-align: center; padding: 6px 0; color: var(--muted); }
.tabs2 div.on { color: var(--ink); border-bottom: 2px solid var(--ink); font-weight: 500; }
.center { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.chartbox { position: relative; height: 150px; border: 1px dashed var(--line); border-radius: 6px; display: grid; place-items: center; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 25% 25%; }
.chartbox span { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; color: var(--muted); font-size: 11px; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.seg { display: inline-flex; gap: 4px; align-items: center; }
.seg button { border: 0; background: transparent; padding: 5px 10px; border-radius: 8px; color: var(--muted); font-weight: 500; }
.seg button.on { background: var(--ink); color: var(--panel); }
.pill-btn { border: 0; background: var(--chip); border-radius: 8px; padding: 6px 10px; font-weight: 500; }
.search { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; min-width: 150px; color: var(--muted); background: var(--panel); }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 880px; }
th { text-align: left; font-weight: 500; padding: 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
td.num, th.num { text-align: right; }
.empty { text-align: center; color: var(--muted); padding: 28px 0; }
.neg { color: var(--neg); }
.pos { color: var(--pos); }

/* ---------- HTB label ---------- */
.htb { display: inline-flex; align-items: center; height: 18px; padding: 0 8px; border-radius: 9px; background: var(--amber); color: var(--on-amber); font-size: 10.5px; font-weight: 700; white-space: nowrap; letter-spacing: 0.01em; vertical-align: middle; }
.htb.thr { background: transparent; border: 1px solid var(--amber); color: var(--amber); }
.card .htb.thr { color: #8a5d00; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .card .htb.thr { color: var(--amber); } }
:root[data-theme="dark"] .card .htb.thr { color: var(--amber); }
.tier { display: inline-block; padding: 1px 8px; border-radius: 9px; font-size: 11px; font-weight: 600; background: var(--chip); color: var(--muted); }
.tier.t1 { background: #ffe6a8; color: #5a3d00; }
.tier.t2 { background: #ffd0cc; color: #7a1f17; }
.rowlink { border: 0; background: transparent; color: var(--blue); padding: 0; text-decoration: underline; }
.ibadge { position: relative; margin-left: 8px; width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--muted); background: transparent; color: var(--muted); font-size: 10px; font-weight: 700; font-style: italic; line-height: 1; padding: 0; vertical-align: 1px; }
.ibadge::before { content: ""; position: absolute; inset: -6px; }
.ibadge:hover, .ibadge:focus-visible { color: var(--ink); border-color: var(--ink); }
.flash { animation: flash 1.2s ease-out 1; }
@keyframes flash { from { background: rgba(242, 169, 0, 0.35); } to { background: transparent; } }
@media (prefers-reduced-motion: reduce) { .flash { animation: none; } }

/* ---------- right symbol panel ---------- */
.side { background: var(--dark); color: var(--on-dark); border-radius: 18px; padding: 16px 14px; display: flex; flex-direction: column; gap: 10px; position: sticky; top: 10px; height: calc(100vh - 20px); overflow-y: auto; border: 1px solid var(--dark-line); }
.symhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; position: relative; }
.symhead .tick { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
.symhead .mag { border: 0; background: transparent; color: var(--on-dark-muted); padding: 2px; display: grid; }
.symhead .mag svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; }
.symname { color: var(--on-dark-muted); font-size: 11px; }
.price { font-size: 38px; font-weight: 600; letter-spacing: -0.02em; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.price small { font-size: 22px; color: var(--on-dark-muted); font-weight: 500; }
.price .chg { font-size: 12px; color: #4cc38a; font-weight: 500; }
.rangebar { height: 3px; border-radius: 2px; background: linear-gradient(90deg, #4cc38a 0 50%, #e5654f 50% 100%); }
.bidask { display: flex; justify-content: space-between; font-size: 11px; color: var(--on-dark-muted); }
.btnrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.dbtn { border: 0; background: var(--dark-3); color: var(--on-dark); border-radius: 10px; padding: 12px 0; font-weight: 600; }
.dbtn:hover:not(:disabled) { background: #3a3b3e; }
.dbtn:disabled { opacity: 0.45; cursor: not-allowed; }
.optchain { display: flex; justify-content: space-between; align-items: center; background: var(--dark-2); border-radius: 10px; padding: 9px 12px; color: var(--on-dark); border: 0; width: 100%; text-align: left; }
.kvd { display: flex; justify-content: space-between; padding: 3px 0; font-size: 12px; }
.kvd span:first-child { color: var(--on-dark-muted); }
.kvd span:last-child { font-weight: 600; }
.borrow { background: var(--dark-2); border-radius: 12px; padding: 10px 12px; font-size: 12px; display: grid; gap: 6px; }
.borrow .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.borrow .row span:first-child { color: var(--on-dark-muted); }
.borrow .note { color: var(--on-dark-muted); font-size: 11px; line-height: 1.35; }
.lock { background: #2a2113; border: 1px solid #5c4513; color: #ffd98a; border-radius: 12px; padding: 10px 12px; font-size: 12px; }
.qa { background: var(--dark-2); border-radius: 14px; padding: 12px; margin-top: auto; }
.qa .hd { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 6px; }
.qa label { font-size: 11px; color: var(--on-dark-muted); display: block; margin-bottom: 4px; }
.qa input[type=number] { width: 100%; background: var(--dark); color: var(--on-dark); border: 1px solid var(--dark-3); border-radius: 8px; padding: 8px 10px; text-align: right; font: inherit; }
.chips { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin: 8px 0; }
.chips button { border: 1px solid var(--dark-3); background: transparent; color: var(--on-dark-muted); border-radius: 6px; padding: 4px 0; font-size: 10.5px; }
.oneTap { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.oneTap button { border: 0; background: var(--dark-3); color: var(--on-dark); border-radius: 6px; padding: 8px 4px; font-size: 11px; font-weight: 600; }
.oneTap button:disabled { opacity: 0.4; cursor: not-allowed; }
.oneTap button:hover:not(:disabled) { background: #3d3e41; }

/* ---------- inline order ticket (side panel) ---------- */
.tk { display: flex; flex-direction: column; flex: 1; min-height: 100%; }
.side:has(.tk) { padding: 10px; }
.tk .card { background: var(--dark-2); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 11px; flex: 1; }
.tk h3 { margin: 0; font-size: 16px; font-weight: 600; }
.tk .sym b { font-size: 17px; font-weight: 700; margin-right: 6px; }
.tk .sym small { display: block; color: var(--on-dark-muted); font-size: 11px; margin-top: 1px; }
.tk .dim, .tk .hint { color: var(--on-dark-muted); }
.tk .hint { font-size: 11px; }
.tk .steps { color: var(--on-dark-muted); gap: 4px 12px; }
.tk .steps li::before { border-color: var(--dark-3); }
.tk .steps li.done, .tk .steps li.now, .tk .steps li.bad { color: var(--on-dark); }
.tk .steps li.done::before { background: var(--pos); border-color: var(--pos); }
.tk .steps li.now::before { background: var(--amber); border-color: var(--amber); }
.tk .steps li.bad::before { background: var(--neg); border-color: var(--neg); }
.tk .rows { display: grid; }
.tk .rw { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 5px 0; font-size: 12.5px; }
.tk .rw > :first-child { color: var(--on-dark-muted); }
.tk .rw > :last-child { flex: 1 1 auto; text-align: right; font-weight: 600; }
.tk .rw input, .tk .rw select { display: block; width: 100%; max-width: 175px; margin-left: auto; background: var(--dark); border: 1px solid var(--dark-3); color: var(--on-dark); border-radius: 8px; padding: 4px 8px; font: inherit; font-size: 12px; font-weight: 500; }
.tk .rw input { text-align: right; }
.tk .rw.tot { border-top: 1px solid var(--dark-3); margin-top: 4px; padding-top: 11px; font-size: 13.5px; }
.tk .rw.tot > :first-child { color: var(--on-dark); font-weight: 600; }
.tk .rate { background: var(--dark); border-radius: 12px; padding: 11px 12px; display: grid; gap: 3px; }
.tk .rate .rw { padding: 3px 0; font-size: 12px; }
.tk .rate .rw > :first-child { color: var(--on-dark); font-weight: 600; }
.tk .apr { flex: none; background: rgba(110, 150, 255, 0.18); color: #9db8ff; padding: 3px 9px; border-radius: 8px; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-weight: 600; }
.tk .rate .note { border-top: 1px solid var(--dark-3); padding-top: 6px; margin-top: 2px; color: var(--on-dark-muted); font-size: 10.5px; line-height: 1.3; }
.tk .ratestat { display: flex; align-items: flex-start; gap: 8px; color: var(--on-dark-muted); font-size: 11.5px; line-height: 1.4; }
.tk .ratestat .dot { flex: none; margin-top: 5px; }
.tk .ratestat .spinner { flex: none; margin-top: 1px; }
.tk .linkbtn { color: var(--on-dark); font-size: 11.5px; }
.tk .spinner { border-color: var(--dark-3); border-top-color: var(--on-dark); margin-right: 0; }
.tk .accepted { background: var(--dark); color: var(--on-dark); }
.tk .warnbox { background: var(--dark); color: var(--on-dark-muted); border-left: 3px solid var(--amber); padding: 10px 12px; font-size: 11px; }
.tk .warnbox ul { margin: 4px 0 0; padding-left: 16px; }
.tk .warnbox li { margin-bottom: 2px; }
.tk .warnbox b { color: var(--on-dark); }
.tk .foot { display: flex; gap: 10px; margin-top: auto; position: sticky; bottom: 0; background: var(--dark-2); padding-top: 8px; }
.tk .back { width: 42px; height: 42px; flex: none; border: 0; border-radius: 50%; background: var(--dark-3); color: var(--on-dark); display: grid; place-items: center; padding: 0; }
.tk .back svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tk .go { flex: 1; border: 0; border-radius: 12px; padding: 11px 10px; background: var(--dark-3); color: var(--on-dark); font-weight: 600; font-size: 14px; }
.tk .go:hover:not(:disabled) { background: #3a3b3e; }
.tk .go.locate { background: #e8892b; color: #141414; }
.tk .go.locate:hover:not(:disabled) { background: #f0993f; }
.tk .go.locate .spinner { border-color: rgba(20, 20, 20, 0.25); border-top-color: #141414; }
.tk .go.submit { background: #1a7f4b; color: #ffffff; }
.tk .go.submit:hover:not(:disabled) { background: #1f9158; }
.tk .go:disabled { opacity: 0.5; cursor: not-allowed; }
.pop { position: absolute; top: 34px; left: 0; z-index: 20; width: 270px; background: var(--dark-2); border: 1px solid var(--dark-3); border-radius: 12px; padding: 6px; box-shadow: var(--shadow); }
.pop button { width: 100%; text-align: left; border: 0; background: transparent; color: var(--on-dark); padding: 8px 10px; border-radius: 8px; display: grid; gap: 2px; }
.pop button:hover { background: var(--dark-3); }
.pop .l1 { display: flex; align-items: center; gap: 6px; font-weight: 600; }
.pop .l2 { color: var(--on-dark-muted); font-size: 11px; }

/* ---------- alerts panel ---------- */
.rail button { position: relative; }
.bdg { position: absolute; top: -5px; right: -6px; min-width: 15px; height: 15px; padding: 0 4px; border-radius: 8px; background: #e8892b; color: #141414; font-size: 9px; font-weight: 700; font-style: normal; line-height: 15px; text-align: center; }
.bellfab { display: none; position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; z-index: 55; width: 38px; height: 38px; border: 0; border-radius: 50%; background: #1b1c1e; color: #ffffff; place-items: center; padding: 0; }
.bellfab svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.alerts { position: fixed; top: 10px; bottom: 10px; left: 64px; width: min(400px, calc(100vw - 80px)); z-index: 70; background: var(--panel); color: var(--ink); border-radius: 28px; box-shadow: var(--shadow); padding: 22px 22px 0; display: flex; flex-direction: column; }
.alerts .ahead { position: relative; display: flex; align-items: center; justify-content: space-between; }
.alerts h2 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; outline: none; }
.alerts .abtns { display: flex; gap: 8px; }
.alerts .ibtn { width: 44px; height: 38px; border: 0; border-radius: 12px; background: var(--chip); color: var(--ink); display: grid; place-items: center; padding: 0; }
.alerts .ibtn svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.alerts .ibtn.on { background: color-mix(in srgb, var(--ink) 22%, var(--chip)); }
.alerts .fwrap { position: relative; }
.alerts .amenu { position: absolute; top: calc(100% + 10px); left: 0; z-index: 3; width: 290px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 12px; }
.alerts .aopt { display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 12px; padding: 12px; }
.alerts .aopt:hover { background: var(--chip); }
.alerts .acb { flex: none; width: 20px; height: 20px; border: 1.5px solid color-mix(in srgb, var(--ink) 25%, transparent); border-radius: 6px; display: grid; place-items: center; margin-top: 2px; }
.alerts .acb.on { background: var(--ink); border-color: var(--ink); color: var(--panel); }
.alerts .acb svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.alerts .aopt b { display: block; font-size: 14px; font-weight: 600; }
.alerts .aopt small { display: block; margin-top: 2px; color: var(--muted); font-size: 12.5px; line-height: 1.35; }
.alerts .asearch { margin-top: 14px; width: 100%; border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 12px; padding: 10px 12px; font: inherit; font-size: 13px; }
.alerts .atabs { display: flex; flex-wrap: wrap; gap: 4px 20px; margin-top: 18px; }
.alerts .atab { border: 0; background: transparent; padding: 6px 0 9px; color: var(--muted); font-size: 14px; font-weight: 600; border-bottom: 2px solid transparent; }
.alerts .atab.on { color: var(--ink); border-bottom-color: var(--ink); }
.alerts .alist { flex: 1; overflow-y: auto; margin: 0 -22px; padding: 4px 22px 18px; }
.alerts .aempty { height: 100%; min-height: 220px; display: grid; place-content: center; justify-items: center; gap: 10px; color: var(--muted); }
.alerts .aempty svg { width: 44px; height: 44px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; opacity: 0.7; }
.alerts .aempty p { margin: 0; font-size: 14px; }
.alerts .aitem { display: grid; grid-template-columns: 34px 1fr; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); cursor: default; }
.alerts .aico { width: 34px; height: 34px; border-radius: 10px; background: var(--chip); color: var(--ink); display: grid; place-items: center; }
.alerts .aico svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.alerts .aico.alert { background: var(--warn-bg); color: var(--warn-ink); }
.alerts .aico.crit { background: var(--bad-bg); color: var(--bad-ink); }
.alerts .at { display: flex; align-items: center; gap: 6px; font-size: 13px; }
.alerts .at b { font-weight: 500; }
.alerts .aitem.unread .at b { font-weight: 700; }
.alerts .at span { margin-left: auto; color: var(--muted); font-size: 11px; white-space: nowrap; }
.alerts .udot { width: 8px; height: 8px; border-radius: 50%; background: #e8892b; flex: none; }
.alerts .abody p { margin: 3px 0 0; color: var(--muted); font-size: 12.5px; line-height: 1.4; }
.alerts .abody p b { color: var(--ink); }
.alerts .aacts { margin-top: 10px; }
.alerts .abtn { border: 0; border-radius: 10px; padding: 8px 12px; background: var(--chip); color: var(--ink); font-weight: 600; font-size: 12.5px; }
.alerts .abtn:hover { background: var(--line); }
.alerts .ares { margin-top: 8px; color: var(--muted); font-size: 11.5px; }
@media (max-width: 760px) {
  .bellfab { display: grid; }

<script>
(function () {
  "use strict";

  /* ---------- demo data ---------- */
  var SYMS = {
    ZRXT: { name: "Zorix Therapeutics, Inc.", exch: "NASDAQ", price: 8.42, chg: 0.31, pct: 3.82, bid: 8.41, ask: 8.43, bidSz: 900, askSz: 1100, open: 8.12, prev: 8.11, high: 8.57, low: 8.05, vol: 4812330, status: "HTB", rate: 42.0, avail: 12000, thr: false },
    KLMN: { name: "Kalmin Mobility Corp.", exch: "NYSE", price: 3.15, chg: 0.42, pct: 15.38, bid: 3.14, ask: 3.16, bidSz: 400, askSz: 650, open: 2.80, prev: 2.73, high: 3.31, low: 2.78, vol: 9120441, status: "HTB", rate: 118.0, avail: 3000, thr: true },
    SPY: { name: "State Street SPDR S&P 500 ETF Trust", exch: "NYSE Arca", price: 762.50, chg: 2.53, pct: 0.33, bid: 762.47, ask: 762.51, bidSz: 1480, askSz: 40, open: 762.20, prev: 759.97, high: 763.06, low: 762.00, vol: 1351143, status: "ETB", rate: 0, avail: 9999999, thr: false },
    QVNT: { name: "Quanta Vent Holdings", exch: "NASDAQ", price: 21.10, chg: -0.12, pct: -0.57, bid: 21.09, ask: 21.11, bidSz: 200, askSz: 300, open: 21.20, prev: 21.22, high: 21.35, low: 20.95, vol: 188220, status: "NOSHORT", rate: 0, avail: 0, thr: false }
  };
  var ORDER = ["ZRXT", "KLMN", "SPY", "QVNT"];
  var BASE_EQUITY = 250000;

  var S = {
    sym: "ZRXT", qty: 10, tab: "positions", popOpen: false, ctlOpen: false,
    demo: { eligible: true, avail: "full", data: "fresh", timer: 30, drift: true, long: false },
    positions: [], orders: [], ledger: [], alerts: [], alertSeq: 0, alertsOpen: false, alertTab: "all", alertQ: "", alertSearch: false, alertUnread: false, alertMenu: false,
    ticket: null, tick: null
  };

  /* ---------- helpers ---------- */
  function $(id) { return document.getElementById(id); }
  function fmt(n, d) { return Number(n).toLocaleString("en-US", { minimumFractionDigits: d === undefined ? 2 : d, maximumFractionDigits: d === undefined ? 2 : d }); }
  function money(n) { return (n < 0 ? "-$" : "$") + fmt(Math.abs(n)); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function today(offsetDays) { var d = new Date(); d.setDate(d.getDate() + (offsetDays || 0)); return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }); }
  function htbLabel(sym) {
    var s = SYMS[sym]; if (s.status !== "HTB") return "";
    return '<span class="htb">Hard to borrow</span>' + (s.thr ? ' <span class="htb thr">Threshold list</span>' : "");
  }
  function charge(qty, price, rate) { return Math.abs(qty) * price * (rate / 100) / 360; }

  /* ---------- toasts ---------- */
  function toast(title, body, acts, plain) {
    var el = document.createElement("div");
    el.className = "toast" + (plain ? " plain" : "");
    var h = (plain ? "" : '<div class="ico" aria-hidden="true">H</div>') + "<div><div class=\"t\">" + esc(title) + "<span>now</span></div><p>" + body + "</p>";
    if (acts && acts.length) h += '<div class="acts">' + acts.map(function (a, i) { return '<button data-i="' + i + '">' + esc(a.label) + "</button>"; }).join("") + "</div>";
    h += "</div>";
    el.innerHTML = h;
    el.querySelectorAll("[data-i]").forEach(function (b) { b.onclick = function () { acts[+b.dataset.i].fn(); el.remove(); }; });
    $("toasts").appendChild(el);
    setTimeout(function () { if (el.parentNode) el.remove(); }, acts && acts.length ? 14000 : 5000);
  }

  /* ---------- alerts panel ---------- */
  var ALERT_TABS = [["all", "All Alerts"], ["trades", "Trades"], ["account", "Account"], ["borrow", "Borrow"]];
  var ALERT_ICON = {
    borrow: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16l6-6 4 4 6-7M15 7h5v5"/></svg>',
    trades: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h13M13 4l4 4-4 4M20 16H7M11 12l-4 4 4 4"/></svg>',
    account: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/></svg>'
  };
  function addAlert(cat, kind, title, body, opts) {
    opts = opts || {};
    S.alerts.unshift({ id: ++S.alertSeq, cat: cat, kind: kind, title: title, body: body, sym: opts.sym || "", cover: !!opts.cover, resolved: false, time: nowTime(), read: false });
    renderBell(); if (S.alertsOpen) renderAlerts();
  }
  function renderBell() {
    var n = S.alerts.filter(function (a) { return !a.read; }).length;
    document.querySelectorAll(".bdg").forEach(function (el) { el.hidden = n === 0; el.textContent = n > 9 ? "9+" : String(n); });
    document.querySelectorAll(".bellbtn").forEach(function (b) { b.setAttribute("aria-label", n ? "Alerts, " + n + " unread" : "Alerts"); b.setAttribute("aria-expanded", S.alertsOpen ? "true" : "false"); });
  }
  function openAlerts() { S.alertsOpen = true; S.alertsFresh = true; setTimeout(function () { S.alertsFresh = false; }, 0); renderAlerts(true); renderBell(); }
  function closeAlerts() { S.alertsOpen = false; S.alertMenu = false; $("alertsRoot").innerHTML = ""; renderBell(); }
  function alertMatches(a) {
    if (S.alertTab !== "all" && a.cat !== S.alertTab) return false;
    if (S.alertUnread && a.read) return false;
    if (S.alertQ) { var hay = (a.title + " " + a.body.replace(/<[^>]+>/g, "") + " " + a.sym).toLowerCase(); if (hay.indexOf(S.alertQ.toLowerCase()) < 0) return false; }
    return true;
  }
  function alertListHtml() {
    var list = S.alerts.filter(alertMatches);
    if (!list.length) {
      return '<div class="aempty"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10l9-6 9 6v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M3 10l9 6 9-6"/></svg><p>' + (S.alertQ ? "No alerts match your search" : "You have no notifications") + "</p></div>";
    }
    return list.map(function (a) {
      return '<article class="aitem' + (a.read ? "" : " unread") + '" data-aid="' + a.id + '">' +
        '<div class="aico ' + a.kind + '">' + ALERT_ICON[a.cat] + "</div>" +
        '<div class="abody"><div class="at"><b>' + esc(a.title) + "</b>" + (a.read ? "" : '<i class="udot" aria-label="Unread"></i>') + "<span>" + a.time + "</span></div><p>" + a.body + "</p>" +
        (a.cover ? '<div class="aacts"><button class="abtn" data-acover="' + a.sym + '">Close or reduce</button></div>' : a.resolved ? '<div class="ares">Position closed</div>' : "") + "</div></article>";
    }).join("");
  }
  function bindAlertList() {
    var root = $("alertsRoot");
    root.querySelectorAll(".aitem").forEach(function (el) {
      el.onclick = function () {
        var a = S.alerts.filter(function (x) { return x.id === +el.dataset.aid; })[0];
        if (a && !a.read) { a.read = true; renderBell(); renderAlerts(); }
      };
    });
    root.querySelectorAll("[data-acover]").forEach(function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        var sym = b.dataset.acover;
        S.alerts.forEach(function (a) { if (a.sym === sym) a.read = true; });
        renderBell(); closeAlerts(); coverModal(sym);
      };
    });
  }
  function renderAlerts(focusPanel) {
    var root = $("alertsRoot");
    var tabs = ALERT_TABS.map(function (t) {
      return '<button class="atab' + (S.alertTab === t[0] ? " on" : "") + '" role="tab" aria-selected="' + (S.alertTab === t[0]) + '" data-atab="' + t[0] + '">' + t[1] + "</button>";
    }).join("");
    var menu = S.alertMenu
      ? '<div class="amenu" role="dialog" aria-label="Filter alerts"><button class="aopt" id="aUnread" type="button" role="checkbox" aria-checked="' + S.alertUnread + '"><span class="acb' + (S.alertUnread ? " on" : "") + '">' + (S.alertUnread ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>' : "") + '</span><span><b>Only unread</b><small>Hide alerts that you have already read</small></span></button></div>'
      : "";
    root.innerHTML = '<section class="alerts" role="dialog" aria-label="Alerts"><div class="ahead"><h2 tabindex="-1">Alerts</h2><div class="abtns">' +
      '<button class="ibtn' + (S.alertSearch ? " on" : "") + '" id="aSearch" type="button" aria-label="Search alerts" aria-pressed="' + S.alertSearch + '"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/></svg></button>' +
      '<span class="fwrap"><button class="ibtn' + (S.alertMenu || S.alertUnread ? " on" : "") + '" id="aFilter" type="button" aria-label="Filter alerts" aria-haspopup="dialog" aria-expanded="' + S.alertMenu + '"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14M8 12h8M11 16h2"/></svg></button>' + menu + '</span></div></div>' +

      '<div class="atabs" role="tablist">' + tabs + '</div><div class="alist" id="alist">' + alertListHtml() + "</div></section>";
    var sec = root.querySelector(".alerts");
    root.querySelectorAll("[data-atab]").forEach(function (b) { b.onclick = function () { S.alertTab = b.dataset.atab; renderAlerts(); }; });

    var u = $("aUnread"); if (u) u.onclick = function () { S.alertUnread = !S.alertUnread; renderAlerts(); };
    var q = $("aQ"); if (q) q.oninput = function () { S.alertQ = q.value; $("alist").innerHTML = alertListHtml(); bindAlertList(); };
    sec.addEventListener("click", function (e) {
      if (S.alertMenu && !e.target.closest(".amenu") && !e.target.closest("#aFilter")) { S.alertMenu = false; renderAlerts(); }

    var m0 = $("modal"), first = m0.querySelector("button, input, select");
    if (first && !m0.contains(document.activeElement)) first.focus();
  }
  function closeModal(keepTicket) {
    $("modalRoot").innerHTML = "";
    if (!keepTicket) { stopTick(); var had = S.ticket; S.ticket = null; if (had) renderSide(); }
  }
  document.addEventListener("keydown", function (e) { if (e.key !== "Escape") return; if (S.alertsOpen) { if (S.alertMenu) { S.alertMenu = false; renderAlerts(); } else closeAlerts(); return; } if ($("modalRoot").innerHTML || S.ticket) closeModal(); });

  /* ---------- render: account ---------- */
  function renderAcct() {
    var shortMV = 0; S.positions.forEach(function (p) { shortMV += Math.abs(p.qty) * SYMS[p.sym].price; });

      '<div class="kv"><span>Long Market Value</span><span>' + money(S.demo.long ? 100 * SYMS[S.sym].price : 0) + '</span></div>' +
      '<div class="kv"><span>Short Market Value</span><span>' + money(shortMV) + '</span></div>' +
      '<div class="sep"></div>' +
      '<h4>REG-T BUYING POWER <span aria-hidden="true">&#8963;</span></h4><div class="big">$' + fmt(BASE_EQUITY * 2 - shortMV * 1.5, 0) + '<small>.00</small></div>' +
      '<div class="tabs2"><div class="on">Intraday</div><div>Overnight</div></div>' +
      '<div class="kv"><span>Maintenance Margin</span><span>' + money(used * 0.5) + '</span></div>' +
      '<div class="kv"><span>Margin Excess</span><span>' + money(excess) + '</span></div>' +
      '<div class="kv"><span>Multiplier</span><span class="mono">x1</span></div>' +
      '<div class="kv"><span>Open Orders</span><span>' + money(0) + '</span></div>' +
      '<div class="sep"></div><h4>Margin Utilization <span aria-hidden="true">&#8963;</span></h4>' +
      '<div class="big">' + (shortMV ? fmt(used / BASE_EQUITY * 100, 1) + "%" : "--") + '</div>' +
      '<div class="kv small"><span class="muted">USED</span><span class="muted">EXCESS</span></div>' +
      '<div class="kv small"><span>' + money(used) + '</span><span>' + money(excess) + '</span></div>' +
      '<p class="muted small" style="margin:12px 0 0">Demo figures</p>';
  }

  /* ---------- render: center ---------- */
  function renderCenter() {
    var h = "";
    h += '<div class="card"><div class="chartbox"><span>No history available</span></div>' +
      '<div class="bar" style="margin-top:10px"><div class="big">$0<small>.00</small></div><div class="seg"><button>1W</button><button class="on">1M</button><button>6M</button><button>YTD</button><button>1Y</button></div></div></div>';
    h += '<div class="card"><div class="bar"><div class="seg" role="tablist">' +
      ["positions|Positions", "orders|Orders", "ledger|Activity"].map(function (t) { var p = t.split("|"); return '<button role="tab" data-tab="' + p[0] + '" class="' + (S.tab === p[0] ? "on" : "") + '">' + p[1] + "</button>"; }).join("") +
      '</div><div class="seg"><button class="pill-btn" data-act="closeall">Close all positions</button><span class="search">Search symbol</span></div></div>';
    if (S.tab === "positions") h += positionsTable();
    else if (S.tab === "orders") h += ordersTable();
    else h += ledgerTable();
    h += "</div>";
    $("center").innerHTML = h;
  }
  function positionsTable() {
    var h = '<div class="tablewrap"><table><thead><tr><th>Symbol</th><th class="num">Qty</th><th class="num">Market Price</th><th class="num">Daily P&amp;L</th><th class="num">Unrealized P&amp;L</th><th class="num">Market Value</th><th class="num">Avg. Entry</th><th>Borrow rate</th><th>Alert tier</th><th class="num">Est. overnight charge</th><th></th></tr></thead><tbody>';
    if (!S.positions.length) return h + '<tr><td colspan="11" class="empty">No data available</td></tr></tbody></table></div>';
    S.positions.forEach(function (p) {
      var s = SYMS[p.sym], mv = p.qty * s.price, upl = (p.avg - s.price) * Math.abs(p.qty);
      var tier = ["", "Elevated", "Critical"][p.tier] || "";
      h += '<tr class="' + (p.flash ? "flash" : "") + '"><td><b>' + p.sym + "</b> " + htbLabel(p.sym) + '</td><td class="num mono">' + fmt(p.qty, 0) + '</td><td class="num">' + money(s.price) +
        '</td><td class="num">$0.00</td><td class="num ' + (upl >= 0 ? "pos" : "neg") + '">' + money(upl) + '</td><td class="num">' + money(mv) + '</td><td class="num">' + money(p.avg) +
        "</td><td>" + (s.status === "HTB" ? fmt(p.rate, 1) + "% " + (p.rate !== p.openRate ? '<span class="muted small">(opened at ' + fmt(p.openRate, 1) + "%)</span>" : "") : "None") +
        '</td><td><span class="tier ' + (p.tier ? "t" + p.tier : "") + '">' + (tier || "Watch") + '</span></td><td class="num">' + (s.status === "HTB" ? money(charge(p.qty, s.price, p.rate)) : "$0.00") +
        '</td><td><button class="rowlink" data-act="close" data-sym="' + p.sym + '">Close</button></td></tr>';
      p.flash = false;
    });
    return h + "</tbody></table></div>";
  }
  function ordersTable() {
    var h = '<div class="tablewrap"><table><thead><tr><th>Time</th><th>Symbol</th><th>Side</th><th class="num">Qty</th><th>Type</th><th>Time in force</th><th>Status</th></tr></thead><tbody>';
    if (!S.orders.length) return h + '<tr><td colspan="7" class="empty">No data available</td></tr></tbody></table></div>';
    S.orders.slice().reverse().forEach(function (o) {
      h += "<tr><td>" + o.time + "</td><td><b>" + o.sym + "</b> " + htbLabel(o.sym) + "</td><td>" + o.side + '</td><td class="num mono">' + fmt(o.qty, 0) + "</td><td>" + o.type + "</td><td>" + o.tif + '</td><td><span class="' + (o.status === "Rejected" ? "neg" : o.status === "Canceled" ? "muted" : "pos") + '">' + o.status + "</span>" + (o.why ? ' <span class="muted small">' + esc(o.why) + "</span>" : "") + "</td></tr>";
    });
    return h + "</tbody></table></div>";
  }
  function ledgerTable() {
    var h = '<div class="tablewrap"><table><thead><tr><th>Date</th><th>Symbol</th><th class="num">Shares</th><th class="num">Price</th><th class="num">Rate</th><th class="num">Charge</th></tr></thead><tbody>';
    if (!S.ledger.length) return h + '<tr><td colspan="6" class="empty">No activity yet. Borrow charges post here for shorts held overnight. Use Prototype controls to simulate an overnight accrual.</td></tr></tbody></table></div>';
    S.ledger.slice().reverse().forEach(function (l, i) {
      h += "<tr><td>" + l.date + "</td><td><b>" + l.sym + "</b> " + htbLabel(l.sym) + '</td><td class="num mono">' + fmt(l.shares, 0) + '</td><td class="num">' + money(l.price) + '</td><td class="num">' + fmt(l.rate, 1) + '%</td><td class="num">' + money(-l.charge) + '<button class="ibadge" type="button" data-act="why" data-i="' + (S.ledger.length - 1 - i) + '" aria-haspopup="dialog" aria-label="Why was I charged? Opens a breakdown of the charge">i</button></td></tr>';
    });
    return h + "</tbody></table></div>";
  }

  /* ---------- render: side panel ---------- */
  function renderSide() {
    if (S.ticket) { renderTicket(); return; }
    var s = SYMS[S.sym], pos = S.positions.filter(function (p) { return p.sym === S.sym; })[0];
    var htb = s.status === "HTB", blocked = htb && !S.demo.eligible;
    var h = '<div class="symhead"><span class="tick">' + S.sym + '</span><button class="mag" id="magBtn" aria-label="Search symbol" aria-expanded="' + S.popOpen + '"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/></svg></button>' + htbLabel(S.sym);
    if (S.popOpen) {
      h += '<div class="pop" role="listbox">' + ORDER.map(function (k) {
        var x = SYMS[k]; return '<button data-pick="' + k + '" role="option"><span class="l1">' + k + " " + htbLabel(k) + (x.status === "NOSHORT" ? ' <span class="small" style="color:var(--on-dark-muted)">Not shortable</span>' : "") + '</span><span class="l2">' + x.name + " (demo)</span></button>";
      }).join("") + "</div>";
    }
    h += '</div><div class="symname">' + esc(s.name) + " &bull; " + s.exch + '<br><b style="color:var(--on-dark)">Position ' + (pos ? fmt(pos.qty, 0) : "0") + "</b> &nbsp; <span>Demo data</span></div>";
    var whole = Math.floor(s.price), cents = (s.price - whole).toFixed(2).slice(1);
    h += '<div class="price"><span>$' + whole + '<small>' + cents + '</small></span><span class="chg">' + (s.chg >= 0 ? "+" : "") + "$" + fmt(Math.abs(s.chg)) + " " + fmt(Math.abs(s.pct)) + "%</span></div>";
    h += '<div class="rangebar"></div><div class="bidask mono"><span>Bid ' + fmt(s.bid) + " &times; " + fmt(s.bidSz, 0) + '</span><span>Spread $' + fmt(s.ask - s.bid) + '</span></div><div class="bidask mono"><span>Ask ' + fmt(s.ask) + " &times; " + fmt(s.askSz, 0) + "</span><span></span></div>";
    h += '<div class="btnrow"><button class="dbtn" data-act="buy">Buy</button><button class="dbtn" data-act="sell"' + (s.status === "NOSHORT" && !pos ? "" : "") + ">" + (S.demo.long ? "Sell" : "Short") + "</button></div>";
    if (htb) {
      if (blocked) h += '<div class="lock"><b>Not available for your account type.</b><br>Short selling hard-to-borrow stocks is limited to experienced, top-tier accounts.</div>';
      h += '<div class="borrow"><div class="row"><span>Est. borrow rate</span><b>' + fmt(s.rate, 1) + '% annualized</b></div>' +
        (s.thr ? '<div class="row"><span>Reg SHO</span><span>On the threshold list</span></div>' : "") +
        '<div class="note">Borrow rate is indicative and can change daily while the position is held.</div></div>';
    }
    h += '<button class="optchain"><span>View Option Chain</span><span aria-hidden="true">&rsaquo;</span></button>';
    [["Opening Price", s.open], ["Previous Close", s.prev], ["High", s.high], ["Low", s.low]].forEach(function (r) { h += '<div class="kvd"><span>' + r[0] + "</span><span>$" + fmt(r[1]) + "</span></div>"; });
    h += '<div class="kvd"><span>Vol. Intra-day</span><span>' + fmt(s.vol, 0) + "</span></div>";
    h += '<div class="qa"><div class="hd"><span>Quick Actions</span><span aria-hidden="true">&#8634;</span></div><label for="qty">Quantity</label><input id="qty" type="number" min="1" value="' + S.qty + '">' +
      '<div class="chips">' + [1, 10, 25, 100, 500].map(function (n) { return '<button data-add="' + n + '">+' + n + "</button>"; }).join("") + '</div>' +
      '<div class="kvd" style="color:var(--on-dark-muted)"><span>One-Tap Orders</span><span></span></div><div class="oneTap">' +
      '<button data-one="buy" data-px="MKT">Buy ' + S.qty + ' @ MKT</button><button data-one="short" data-px="MKT">' + sellWord() + S.qty + ' @ MKT</button>' +
      '<button data-one="buy" data-px="BID">Buy ' + S.qty + ' @ BID</button><button data-one="short" data-px="ASK">' + sellWord() + S.qty + ' @ ASK</button>' +
      '<button data-one="buy" data-px="MID">Buy ' + S.qty + ' @ MID</button><button data-one="short" data-px="MID">' + sellWord() + S.qty + ' @ MID</button>' +
      '<button disabled>Buy 10% BP @ASK</button><button disabled>Sell 10% @BID</button></div></div>';
    $("side").innerHTML = h;
  }

  /* ---------- events ---------- */
  document.addEventListener("click", function (e) {
    if (S.alertsOpen && !S.alertsFresh && !e.target.closest(".alerts, .bellbtn")) closeAlerts();
    var t = e.target.closest("button, [data-act]"); if (!t) { if (S.popOpen && !e.target.closest(".pop")) { S.popOpen = false; renderSide(); } return; }
    if (t.id === "magBtn") { S.popOpen = !S.popOpen; renderSide(); return; }
    if (t.dataset.pick) { S.sym = t.dataset.pick; S.popOpen = false; renderAll(); return; }
    if (t.dataset.tab) { S.tab = t.dataset.tab; renderCenter(); return; }
    if (t.dataset.add) { S.qty = (+S.qty || 0) + (+t.dataset.add); renderSide(); return; }
    if (t.dataset.one) { oneTap(t.dataset.one, t.dataset.px); return; }
    var a = t.dataset.act;
    if (a === "buy") { placeSimple("Buy", S.sym, S.qty, "Market"); return; }
    if (a === "sell") { sellClicked(); return; }
    if (a === "close") { coverModal(t.dataset.sym); return; }
    if (a === "closeall") { if (S.positions.length) coverModal(S.positions[0].sym); return; }
    if (a === "why") { whyModal(+t.dataset.i); return; }
  });
  document.addEventListener("input", function (e) {
    if (e.target.id === "qty") { S.qty = Math.max(1, Math.floor(+e.target.value || 1)); var oneTapEls = document.querySelectorAll(".oneTap button[data-one]"); oneTapEls.forEach(function (b) { b.textContent = (b.dataset.one === "buy" ? "Buy " : sellWord()) + S.qty + " @ " + b.dataset.px; }); }
  });

  function nowTime() { return new Date().toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }); }
  function addOrder(side, sym, qty, type, tif, status, why) { S.orders.push({ time: nowTime(), side: side, sym: sym, qty: qty, type: type, tif: tif, status: status, why: why || "" }); }
  function placeSimple(side, sym, qty, type) {
    addOrder(side, sym, qty, type, "Day", "Accepted");
    toast("Order placed", side + " " + fmt(qty, 0) + " " + sym + " (" + type + ").", null, true);
    addAlert("trades", "info", "Order placed", side + " " + fmt(qty, 0) + " " + sym + " (" + type + ").");
    renderCenter();
  }
  function sellWord() { return S.demo.long ? "Sell " : "SHORT "; }
  function oneTap(side, px) {
    if (side === "buy") { placeSimple("Buy", S.sym, S.qty, px === "MKT" ? "Market" : "Limit @ " + px); return; }
    if (S.demo.long && S.qty <= 100 && SYMS[S.sym].status !== "NOSHORT") { placeSimple("Sell", S.sym, S.qty, px === "MKT" ? "Market" : "Limit @ " + px); return; }
    startShort(S.sym, S.qty, px === "MKT" ? "Market" : "Limit");
  }
  function sellClicked() {
    var pos = S.positions.filter(function (p) { return p.sym === S.sym; })[0];
    if (S.demo.long && S.qty <= 100 && SYMS[S.sym].status !== "NOSHORT") { placeSimple("Sell", S.sym, S.qty, "Market"); return; }
    startShort(S.sym, S.qty, "Market");
  }

  /* ---------- short flow ---------- */
  function startShort(sym, qty, type) {
    var s = SYMS[sym];
    if (s.status === "NOSHORT") { rejectModal(sym, qty, "Can’t be sold short", sym + " isn’t available to short right now. No shares are available to borrow.", true); return; }
    if (s.status === "ETB") { placeSimple("Sell short", sym, qty, type); return; }
    if (!S.demo.eligible) { lockedModal(); return; }
    openTicket(sym, qty, type);
  }

  function lockedModal() {
    openModal('<div class="mhead"><h3>Not available for your account type</h3><button class="x" aria-label="Close" data-close>&times;</button></div>' +
      '<div class="mbody"><p style="margin:0">Short selling hard-to-borrow stocks is limited to customers with an experienced trading profile on our highest account tier.</p><p class="muted" style="margin:0">Your account can still short easy-to-borrow stocks.</p></div>' +
      '<div class="mfoot"><button class="btn" data-close>Close</button><button class="btn primary" data-close>See account tiers</button></div>', false, bindClose);
  }
  function bindClose(m) { m.querySelectorAll("[data-close]").forEach(function (b) { b.onclick = function () { closeModal(); }; }); }

  function openTicket(sym, qty, type) {
    var s = SYMS[sym];
    S.ticket = { sym: sym, qty: qty, type: type, limit: s.price, tif: "Day", session: "ext", rate: s.rate, prevRate: null, status: "live", refreshAt: Date.now() + S.demo.timer * 1000, needConfirm: false, confirmed: true, phase: "check", offerQty: 0, drifted: false, busy: false };
    S.popOpen = false;
    renderTicket(true);
    startTick();
  }
  function stale() { return S.demo.data === "stale"; }

  function stepsHtml(t) {
    var names = ["Order details", "Locate", "Submit"];
    var idx = { check: 0, requesting: 1, norshares: 1, offer: 2 }[t.phase];
    return '<ol class="steps" aria-label="Progress">' + names.map(function (n, i) {
      var c = i < idx ? "done" : (i === idx ? (t.phase === "norshares" ? "bad" : "now") : "");
      return '<li class="' + c + '"' + (i === idx ? ' aria-current="step"' : "") + ">" + n + "</li>";
    }).join("") + "</ol>";
  }
  var HTB_NO = { "Stop limit": 1, "Trailing stop": 1, "GTC": 1, "GTD": 1 };
  function optHtml(o, cur) {
    var no = HTB_NO[o];
    return '<option value="' + o + '"' + (o === cur ? " selected" : "") + (no ? " disabled" : "") + ">" + o + (no ? " (not available for HTB)" : "") + "</option>";
  }
  var SESSIONS = [["reg", "Regular: 9:30 AM to 4 PM ET"], ["ext", "Extended: 4 AM to 8 PM ET"], ["on", "Overnight (not available for HTB)", true]];
  var SES_SHORT = { reg: "Regular", ext: "Extended", on: "Overnight" };
  function rw(label, val, id, cls) {
    return '<div class="rw' + (cls ? " " + cls : "") + '">' + (id ? '<label for="' + id + '">' + label + "</label>" : "<span>" + label + "</span>") + "<span>" + val + "</span></div>";
  }

  /* The order ticket lives in the right-hand panel (no popup): Order details, Locate, Submit. */
  function renderTicket(focusFirst) {
    var t = S.ticket; if (!t) return;
    var s = SYMS[t.sym], ph = t.phase, edit = ph === "check";
    var px = t.type === "Market" ? s.ask : (+t.limit || s.price);
    var q = ph === "offer" ? t.offerQty : t.qty;
    var est = charge(q, px, t.rate);
    var checking = t.status === "checking";
    var rateOk = !stale() && !checking && (!t.needConfirm || t.confirmed);
    var dash = ph === "requesting";
    var limitLike = t.type !== "Market" && t.type !== "Trailing stop";

    var rows = rw("Quantity", edit ? '<input id="tQty" type="number" min="1" value="' + t.qty + '">' : fmt(q, 0) + (ph === "offer" && t.offerQty < t.qty ? ' <small class="dim">of ' + fmt(t.qty, 0) + "</small>" : ""), edit ? "tQty" : "");
    rows += rw("Order type", edit ? '<select id="tType">' + ["Market", "Limit", "Stop", "Stop limit", "Trailing stop"].map(function (o) { return optHtml(o, t.type); }).join("") + "</select>" : esc(t.type), edit ? "tType" : "");
    rows += limitLike
      ? rw(t.type === "Limit" ? "Limit price" : "Price", edit ? '<input id="tLim" type="number" step="0.01" value="' + t.limit + '">' : "$" + fmt(+t.limit || s.price), edit ? "tLim" : "")
      : rw("Market Price", "$" + fmt(px));
    rows += rw("Time in force", edit ? '<select id="tTif">' + ["Day", "IOC", "FOK", "At the close", "GTC", "GTD"].map(function (o) { return optHtml(o, t.tif); }).join("") + "</select>" : esc(t.tif), edit ? "tTif" : "");
    rows += rw("Session", edit ? '<select id="tSes">' + SESSIONS.map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === t.session ? " selected" : "") + (o[2] ? " disabled" : "") + ">" + o[1] + "</option>"; }).join("") + "</select>" : SES_SHORT[t.session], edit ? "tSes" : "");
    rows += rw("Total Cost (est.)", money(q * px), "", "tot");

    var ratecard = stale()
      ? '<div class="badbox"><b>Current rate unavailable.</b> Borrow data for ' + t.sym + " is out of date, so we can’t show a rate. New hard-to-borrow shorts in this name are blocked until it refreshes.</div>"
      : '<div class="rate"><div class="rw"><span>Est. borrow rate</span><span class="apr">' + (dash ? "—" : fmt(t.rate, 1) + "% APR") + "</span></div>" +
        '<div class="rw"><span>Est. overnight borrow charge</span><span>' + (dash ? "—" : "<b>" + money(est) + '</b> <small class="dim">per day</small>') + "</span></div>" +
        '<div class="note">Borrow rate is indicative and can change daily while the position is held.</div></div>';

    var status = "";
    if (ph === "requesting") status = '<div class="ratestat" role="status"><span class="spinner" aria-hidden="true"></span><span><b>Requesting a locate for ' + fmt(t.qty, 0) + " shares.</b> This usually takes a few seconds.</span></div>";
    else if (!stale() && (ph === "check" || ph === "offer")) {
      status = checking
        ? '<div class="ratestat" role="status"><span class="spinner" aria-hidden="true"></span>Updating the rate…</div>'
        : '<div class="ratestat"><span class="dot" aria-hidden="true"></span><span>Rate is up to date. We refresh it automatically. <button class="linkbtn" id="tRefresh" type="button">Refresh now</button></span></div>';
    }
    var changed = !t.needConfirm ? "" : t.confirmed
      ? '<div class="accepted' + (t.fresh ? " fresh" : "") + '" role="status"><span class="tick" aria-hidden="true">&#10003;</span><span><b>New rate accepted:</b> ' + fmt(t.prevRate, 1) + "% &rarr; " + fmt(t.rate, 1) + "% annualized</span></div>"
      : '<div class="changed" role="status"><div><b>The rate was updated:</b> ' + fmt(t.prevRate, 1) + "% &rarr; " + fmt(t.rate, 1) + '%. Review it before you continue.</div><div><button class="btn amber" id="chgAccept" type="button">Accept new rate</button></div></div>';
    t.fresh = false;
    var warn = '<div class="warnbox"><b>Before you submit</b><ul><li>Losses on a short are theoretically unlimited.</li><li>This is the current rate. It can change at any time, even right after you submit.</li><li>Shares can be recalled, which can force a buy-in.</li>' + (s.thr ? "<li>This stock is on the Reg SHO threshold list, which carries a higher risk of being bought in.</li>" : "") + "</ul></div>";
    var partial = ph === "offer" && t.offerQty < t.qty
      ? '<div class="changed" role="status"><div><b>Only ' + fmt(t.offerQty, 0) + " of " + fmt(t.qty, 0) + " shares are available.</b> You can submit the smaller amount or go back and edit.</div></div>" : "";
    var hint = "";

    var arrow = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>';
    var back = function (label) { return '<button class="back" id="tBack" type="button" aria-label="' + label + '" title="' + label + '">' + arrow + "</button>"; };
    var spin = '<span class="spinner" aria-hidden="true"></span>';
    var panel, foot;
    if (ph === "norshares") {
      panel = '<div class="badbox" role="alert"><b>No shares are available to borrow for ' + t.sym + " right now.</b> Your order has not been placed and nothing was borrowed. Try again later or choose another stock.</div>";
      foot = back("Edit order") + '<button class="go" id="tClose" type="button">Close</button>';
    } else {
      panel = partial + ratecard + status + changed + (ph === "offer" ? warn : "");
      if (ph === "check") foot = back("Cancel order") + '<button class="go locate" id="tLocate" type="button"' + (rateOk && !t.busy && t.qty >= 1 ? "" : " disabled") + ">" + (t.busy ? spin + "Checking order…" : "Request locate") + "</button>";
      else if (ph === "requesting") foot = back("Cancel order") + '<button class="go locate" type="button" disabled>' + spin + "Requesting locate…</button>";
      else foot = back("Edit order") + '<button class="go submit" id="tSubmit" type="button"' + (rateOk && !t.busy ? "" : " disabled") + ">" + (t.busy ? spin + "Submitting…" : "Submit") + "</button>";
    }

    var html = '<div class="tk"><div class="card"><h3>Short ' + esc(t.type) + ' Order</h3>' +
      '<div class="sym"><b>' + t.sym + "</b>" + htbLabel(t.sym) + "<small>" + esc(s.name) + " | " + s.exch + "</small><small>Last $" + fmt(s.price) + " &bull; Bid " + fmt(s.bid) + " &bull; Ask " + fmt(s.ask) + "</small></div>" +
      stepsHtml(t) + '<div class="rows">' + rows + "</div>" + panel + hint + '<div class="foot">' + foot + "</div></div></div>";

    var keepFocus = document.activeElement && document.activeElement.id;
    var side = $("side");
    side.innerHTML = html;

    var bind = function (id, key, num) { var el = side.querySelector("#" + id); if (!el) return; el.onchange = function () { t[key] = num ? (+el.value || 1) : el.value; onTicketChange(); }; };
    bind("tQty", "qty", true); bind("tType", "type"); bind("tLim", "limit", true); bind("tTif", "tif"); bind("tSes", "session");
    var on = function (id, fn) { var el = side.querySelector("#" + id); if (el) el.onclick = fn; };
    on("tRefresh", refreshRate); on("tLocate", checkOrder); on("tSubmit", submitTicket);
    on("tBack", function () { if (ph === "check" || ph === "requesting") cancelTicket(); else editOrder(); });
    on("tClose", cancelTicket);
    on("chgAccept", function () { t.confirmed = true; t.fresh = true; renderTicket(true); var p = side.querySelector(".go:not([disabled])"); if (p) p.focus(); });

    if (focusFirst) {
      side.scrollTop = 0;
      var first = side.querySelector(edit ? "#tQty" : ".go:not([disabled])"); if (first) first.focus();
    } else if (keepFocus) {
      var f = side.querySelector("#" + keepFocus); if (f && f.focus) f.focus();
    }
  }
  function editOrder() {
    var t = S.ticket; if (!t) return;
    t.phase = "check"; t.offerQty = 0; t.refreshAt = Date.now() + S.demo.timer * 1000; renderTicket(true);
  }
  function cancelTicket() {
    if (!S.ticket) return;
    closeModal();
  }
  function onTicketChange() {
    var t = S.ticket; t.status = "checking"; renderTicket();
    setTimeout(function () {
      if (S.ticket !== t) return;
      t.status = "live"; t.needConfirm = false; t.confirmed = true; t.refreshAt = Date.now() + S.demo.timer * 1000; renderTicket();
    }, 700);
  }

  /* The rate refreshes on its own. There is no countdown and no blocking screen:
     if the rate moved, the customer sees a short note and confirms they've seen it. */
  function refreshRate() {
    var t = S.ticket, s = SYMS[t.sym]; t.status = "checking"; renderTicket();
    setTimeout(function () {
      if (S.ticket !== t) return;
      var old = t.rate;
      if (S.demo.drift && !t.drifted) { s.rate = Math.round((s.rate + (s.thr ? 9 : 3.5)) * 10) / 10; t.drifted = true; }
      t.rate = s.rate;
      t.status = "live";
      if (t.rate !== old) { t.prevRate = old; t.needConfirm = true; t.confirmed = false; }
      t.refreshAt = Date.now() + S.demo.timer * 1000; renderTicket();
    }, 700);
  }
  function startTick() {
    stopTick();
    S.tick = setInterval(function () {
      var t = S.ticket; if (!t || t.status === "checking" || t.busy || stale()) return;
      if (t.phase !== "check" && t.phase !== "offer") return;
      if (Date.now() < t.refreshAt) return;
      var a = document.activeElement;
      if (a && a.closest && a.closest("#side") && /^(INPUT|SELECT)$/.test(a.tagName) && a.type !== "checkbox" && !a.disabled) { t.refreshAt = Date.now() + 3000; return; }
      refreshRate();
    }, 500);
  }
  function stopTick() { if (S.tick) { clearInterval(S.tick); S.tick = null; } }

  /* ---------- check, locate, review ---------- */
  function checkOrder() {
    var t = S.ticket; if (!t) return;
    t.busy = true; renderTicket();
    setTimeout(function () {
      if (S.ticket !== t) return;
      var reason = null, title = "Order rejected";
      if (t.type === "Trailing stop") reason = "Trailing stop orders aren’t supported for hard-to-borrow shorts. Use a Market or Limit order.";
      else if (t.type === "Stop limit" && t.session === "ext") reason = "Extended-hours stop limit orders aren’t supported for hard-to-borrow shorts. Use a Limit order.";
      else if (t.tif === "GTC" || t.tif === "GTD") reason = t.tif + " orders aren’t accepted for hard-to-borrow shorts because borrow is confirmed one trading day at a time. Use a Day order.";
      else if (S.demo.long && t.qty > 100) { title = "One order can’t flip your position"; reason = "You hold 100 shares long in " + t.sym + ". Sell your long first, then short in a separate order."; }
      t.busy = false;
      if (reason) { var q = t.qty, ty = t.type, tf = t.tif; addOrder("Sell short", t.sym, q, ty, tf, "Rejected", title); closeModal(); rejectModal(t.sym, q, title, reason, false); renderCenter(); return; }
      requestLocate();
    }, 600);
  }
  function requestLocate() {
    var t = S.ticket, s = SYMS[t.sym];
    t.phase = "requesting"; renderTicket();
    setTimeout(function () {
      if (S.ticket !== t || t.phase !== "requesting") return;
      var avail = S.demo.avail === "none" ? 0 : S.demo.avail === "partial" ? Math.floor(t.qty * 0.4) : Math.max(s.avail, t.qty);
      if (avail < 1) { t.phase = "norshares"; renderTicket(); return; }
      t.offerQty = Math.min(t.qty, avail); t.phase = "offer"; t.refreshAt = Date.now() + S.demo.timer * 1000; renderTicket();
    }, 1500);
  }

  function submitTicket() {
    var t = S.ticket, s = SYMS[t.sym]; if (!t) return;
    t.busy = true; renderTicket();
    setTimeout(function () {
      if (S.ticket !== t) return;
      var q = t.offerQty, px = t.type === "Market" ? s.ask : (+t.limit || s.price);
      S.positions.push({ sym: t.sym, qty: -q, avg: px, rate: t.rate, openRate: t.rate, tier: 0, flash: true });
      addOrder("Sell short", t.sym, q, t.type, t.tif, "Accepted");
      closeModal(); renderAll();
      toast("Short order accepted", "Sold short " + fmt(q, 0) + " " + t.sym + ". Rate shown: " + fmt(t.rate, 1) + "%. It can change at any time, even right after you submit.", null, true);
      addAlert("trades", "info", "Short order accepted", "Sold short " + fmt(q, 0) + " " + t.sym + ". Est. borrow rate " + fmt(t.rate, 1) + "%.");
    }, 900);
  }

  function rejectModal(sym, qty, title, reason, notShortable) {
    openModal('<div class="mhead"><h3>' + esc(title) + '</h3><button class="x" aria-label="Close" data-close>&times;</button></div><div class="mbody"><div class="badbox">' + esc(reason) + "</div>" +
      (notShortable ? "" : '<p class="muted small" style="margin:0">Rejected orders aren’t charged. Nothing was borrowed.</p>') + "</div>" +
      '<div class="mfoot"><button class="btn primary" data-close>' + (notShortable ? "Close" : "Edit order") + "</button></div>", false, function (m) {
        bindClose(m);
        if (!notShortable) m.querySelector(".btn.primary").onclick = function () { closeModal(); openTicket(sym, qty, "Market"); };
      });
  }

  function coverModal(sym) {
    var p = S.positions.filter(function (x) { return x.sym === sym; })[0]; if (!p) return;
    openModal('<div class="mhead"><h3>Close short ' + sym + '</h3><button class="x" aria-label="Close" data-close>&times;</button></div><div class="mbody"><p style="margin:0">Buy ' + fmt(Math.abs(p.qty), 0) + " " + sym + " at market to close this short. A same-day close has no borrow charge; borrow charges stop after the closing trade settles.</p></div>" +
      '<div class="mfoot"><button class="btn" data-close>Keep position</button><button class="btn primary" id="cover">Buy to close</button></div>', false, function (m) {
        bindClose(m);
        m.querySelector("#cover").onclick = function () {
          addOrder("Buy to cover", sym, Math.abs(p.qty), "Market", "Day", "Accepted");
          S.positions = S.positions.filter(function (x) { return x !== p; });
          S.alerts.forEach(function (a) { if (a.sym === sym && a.cover) { a.cover = false; a.resolved = true; } });
          closeModal(); renderAll(); toast("Position closed", "Bought " + fmt(Math.abs(p.qty), 0) + " " + sym + " to cover.", null, true);
          addAlert("trades", "info", "Position closed", "Bought " + fmt(Math.abs(p.qty), 0) + " " + sym + " to cover.");
        };
      });
  }
  function whyModal(i) {
    var l = S.ledger[i]; if (!l) return;
    openModal('<div class="mhead"><h3>Why was I charged?</h3><button class="x" aria-label="Close" data-close>&times;</button></div><div class="mbody"><p style="margin:0">You were short ' + fmt(l.shares, 0) + " shares of <b>" + l.sym + "</b> overnight on " + l.date + ". Hard-to-borrow shorts pay a daily borrow fee.</p>" +
      '<div class="cost"><div class="r"><span>Shares</span><b>' + fmt(l.shares, 0) + '</b></div><div class="r"><span>Price</span><b>' + money(l.price) + '</b></div><div class="r"><span>Borrow rate that day</span><b>' + fmt(l.rate, 1) + '% annualized</b></div><div class="r"><span>Charge</span><b>' + money(l.charge) + '</b></div><div class="f">' + fmt(l.shares, 0) + " &times; $" + fmt(l.price) + " &times; " + fmt(l.rate, 1) + "% &divide; 360 = " + money(l.charge) + "</div></div>" +
      '<p class="muted small" style="margin:0">' + esc(l.note) + "</p></div><div class=\"mfoot\"><button class=\"btn primary\" data-close>Close</button></div>", false, bindClose);
  }

  /* ---------- simulations ---------- */
  function ensurePosition(sym) {
    var p = S.positions.filter(function (x) { return x.sym === sym; })[0];
    if (!p) { var s = SYMS[sym]; p = { sym: sym, qty: -1000, avg: s.price - 0.2, rate: s.rate, openRate: s.rate, tier: 0, flash: true }; S.positions.push(p); }
    return p;
  }
  function simRateUp() {
    var p = S.positions.filter(function (x) { return SYMS[x.sym].status === "HTB"; })[0] || ensurePosition("ZRXT");
    var s = SYMS[p.sym], old = p.rate, add = p.tier === 0 ? 36 : 60;
    p.rate = Math.round((old + add) * 10) / 10; s.rate = p.rate; p.tier = Math.min(2, p.tier + 1); p.flash = true;
    var oc = charge(p.qty, s.price, old), nc = charge(p.qty, s.price, p.rate);
    var body = "<b>" + p.sym + "</b> borrow rate rose from " + fmt(old, 1) + "% to " + fmt(p.rate, 1) + "%. Estimated overnight charge on your short: " + money(nc) + " (was " + money(oc) + ").";
    addAlert("borrow", p.tier === 2 ? "crit" : "alert", "Rate alert: " + p.sym, body, { sym: p.sym, cover: true });
    toast("Rate alert: " + p.sym, body, [{ label: "Close or reduce", fn: function () { coverModal(p.sym); } }, { label: "View alerts", fn: openAlerts }]);
    S.tab = "positions"; renderAll();
  }
  function simRecall() {
    var p = S.positions.filter(function (x) { return x.sym === "KLMN"; })[0] || ensurePosition("KLMN");
    p.tier = 2; p.flash = true;
    addAlert("borrow", "crit", "Recall notice: " + p.sym, "Shares for " + p.sym + " are no longer available to borrow. Close your short before the next market open to avoid a buy-in.", { sym: p.sym, cover: true });
    toast("Recall notice: " + p.sym, "Shares are no longer available to borrow. Close your short before the next market open to avoid a buy-in.", [{ label: "Close or reduce", fn: function () { coverModal(p.sym); } }, { label: "View alerts", fn: openAlerts }]);
    S.tab = "positions"; renderAll();
  }
  function simOvernight() {
    var any = false;
    S.positions.forEach(function (p) {
      var s = SYMS[p.sym]; if (s.status !== "HTB") return; any = true;
      var c = charge(p.qty, s.price, p.rate);
      addAlert("account", "info", "Borrow charge posted: " + p.sym, "Charged " + money(c) + " for " + fmt(Math.abs(p.qty), 0) + " shares of " + p.sym + " at " + fmt(p.rate, 1) + "%. See Activity for details.", { sym: p.sym });
      S.ledger.push({ date: today(S.ledger.length), sym: p.sym, shares: Math.abs(p.qty), price: s.price, rate: p.rate, charge: c, note: p.rate !== p.openRate ? "The rate changed from " + fmt(p.openRate, 1) + "% when you opened the short to " + fmt(p.rate, 1) + "%. Charges use the rate in effect for the day." : "The rate stayed at " + fmt(p.rate, 1) + "% since you opened the short." });
    });
    if (!any) { ensurePosition("ZRXT"); simOvernight(); return; }
    S.tab = "ledger"; renderAll();
  }

  /* ---------- prototype controls ---------- */
  function renderCtl() {
    function opts(key, list) { return '<div class="opts">' + list.map(function (o) { return '<button data-k="' + key + '" data-v="' + o[0] + '" class="' + (String(S.demo[key]) === String(o[0]) ? "on" : "") + '">' + o[1] + "</button>"; }).join("") + "</div>"; }
    $("ctl").innerHTML =
      '<div><h5>Jump to a screen</h5><div class="opts">' +
      [["1", "1 Stock page and label"], ["3", "3 Order ticket"], ["3b", "3 Locate offer"], ["4", "4 Position and activity"], ["5", "5 Rate alert"], ["6", "6 Rate updated"], ["7a", "7 Partial locate"], ["7g", "7 No shares to borrow"], ["7b", "7 GTC rejected"], ["7d", "7 Recall"], ["7f", "7 Not eligible"]].map(function (j) { return '<button class="go" data-jump="' + j[0] + '">' + j[1] + "</button>"; }).join("") + "</div></div>" +
      "<div><h5>Account eligibility</h5>" + opts("eligible", [[true, "Eligible"], [false, "Not eligible"]]) + "</div>" +
      "<div><h5>Shares available to borrow</h5>" + opts("avail", [["full", "Full"], ["partial", "Partial"], ["none", "None"]]) + "</div>" +
      "<div><h5>Borrow rate data</h5>" + opts("data", [["fresh", "Fresh"], ["stale", "Stale"]]) + "</div>" +
      "<div><h5>Rate refresh interval</h5>" + opts("timer", [[8, "8 sec"], [30, "30 sec"], [45, "45 sec"]]) + "</div>" +
      "<div><h5>Rate moves on refresh</h5>" + opts("drift", [[true, "Yes"], [false, "No"]]) + "</div>" +
      "<div><h5>Existing long position</h5>" + opts("long", [[false, "None"], [true, "100 shares"]]) + "</div>" +
      '<div><h5>Simulate</h5><div class="opts"><button class="go" data-sim="up">Rate increase alert</button><button class="go" data-sim="recall">Recall notice</button><button class="go" data-sim="night">Overnight accrual</button><button class="go" data-sim="reset">Reset demo</button></div></div>' +
      '<p class="hint">Demo data and fictional tickers except SPY. Controls change the scenario; they aren’t part of the product.</p>';
  }
  $("ctlBtn").onclick = function () { S.ctlOpen = !S.ctlOpen; $("ctl").hidden = !S.ctlOpen; $("ctlBtn").setAttribute("aria-expanded", S.ctlOpen); if (S.ctlOpen) renderCtl(); };
  $("ctl").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    if (b.dataset.k) { var v = b.dataset.v; S.demo[b.dataset.k] = v === "true" ? true : v === "false" ? false : (b.dataset.k === "timer" ? +v : v); renderCtl(); renderAll(); return; }
    if (b.dataset.sim) { var k = b.dataset.sim; if (k === "up") simRateUp(); if (k === "recall") simRecall(); if (k === "night") simOvernight(); if (k === "reset") resetDemo(); renderCtl(); return; }
    if (b.dataset.jump) jump(b.dataset.jump);
  });
  function resetDemo() {
    SYMS.ZRXT.rate = 42.0; SYMS.KLMN.rate = 118.0;
    S.positions = []; S.orders = []; S.ledger = []; S.alerts = []; S.tab = "positions"; S.sym = "ZRXT"; S.qty = 10;
    S.demo = { eligible: true, avail: "full", data: "fresh", timer: 30, drift: true, long: false };
    closeModal(); closeAlerts(); renderBell(); renderAll();
  }
  function jump(k) {
    closeModal(); closeAlerts(); $("toasts").innerHTML = "";
    S.ctlOpen = false; $("ctl").hidden = true; $("ctlBtn").setAttribute("aria-expanded", "false");
    S.demo.eligible = true; S.demo.data = "fresh"; S.demo.long = false; S.demo.avail = "full";
    SYMS.ZRXT.rate = 42.0; SYMS.KLMN.rate = 118.0;
    if (k === "1") { S.sym = "ZRXT"; S.popOpen = true; S.positions = []; renderAll(); return; }
    if (k === "3") { S.sym = "ZRXT"; renderAll(); openTicket("ZRXT", 1000, "Market"); return; }
    if (k === "4") { S.positions = []; S.ledger = []; S.alerts = []; ensurePosition("ZRXT"); S.sym = "ZRXT"; simOvernight(); return; }
    if (k === "5") { S.positions = []; S.alerts = []; ensurePosition("ZRXT"); S.sym = "ZRXT"; simRateUp(); openAlerts(); return; }
    if (k === "3b") { S.sym = "ZRXT"; renderAll(); openTicket("ZRXT", 1000, "Market"); checkOrder(); return; }
    if (k === "6") { S.sym = "ZRXT"; S.demo.drift = true; renderAll(); openTicket("ZRXT", 1000, "Market"); refreshRate(); return; }
    if (k === "7a") { S.sym = "KLMN"; S.demo.avail = "partial"; renderAll(); openTicket("KLMN", 5000, "Market"); checkOrder(); return; }
    if (k === "7g") { S.sym = "ZRXT"; S.demo.avail = "none"; renderAll(); openTicket("ZRXT", 1000, "Market"); checkOrder(); return; }
    if (k === "7b") { S.sym = "ZRXT"; renderAll(); openTicket("ZRXT", 1000, "Limit"); S.ticket.tif = "GTC"; checkOrder(); return; }
    if (k === "7d") { S.positions = []; S.alerts = []; S.sym = "KLMN"; ensurePosition("KLMN"); simRecall(); openAlerts(); return; }
    if (k === "7f") { S.sym = "ZRXT"; S.demo.eligible = false; renderAll(); startShort("ZRXT", 1000, "Market"); return; }
  }

  function renderAll() { renderAcct(); renderCenter(); renderSide(); if (S.ctlOpen) renderCtl(); }
  renderAll();
})();
</script>
</body>
</html>
