<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hard-to-borrow shorting: prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #dde1e6;
  --panel: #ffffff;
  --ink: #111214;
  --muted: #6a7078;
  --line: #e6e8eb;
  --chip: #f1f2f4;
  --rail: #0e0f10;
  --dark: #131415;
  --dark-2: #232426;
  --dark-3: #2f3032;
  --dark-line: #2c2d2f;
  --on-dark: #f2f3f5;
  --on-dark-muted: #9a9ea4;
  --amber: #f2a900;
  --on-amber: #141414;
  --pos: #1a7f4b;
  --neg: #c4372b;
  --blue: #2f6bff;
  --warn-bg: #fff6e0;
  --warn-ink: #5a3d00;
  --bad-bg: #fdeceb;
  --bad-ink: #7a1f17;
  --shadow: 0 10px 40px rgba(10, 12, 16, 0.25);
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #09090a; --panel: #17181a; --ink: #f2f3f5; --muted: #9aa0a8; --line: #2a2c2f; --chip: #232528;
    --rail: #101112; --dark: #101112; --dark-2: #1d1e20; --dark-3: #2a2b2d; --dark-line: #2a2b2d;
    --warn-bg: #3a2e0c; --warn-ink: #ffe3a3; --bad-bg: #3b1613; --bad-ink: #ffc9c3; --pos: #4cc38a; --neg: #ff7a6e;
    --shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #09090a; --panel: #17181a; --ink: #f2f3f5; --muted: #9aa0a8; --line: #2a2c2f; --chip: #232528;
  --rail: #101112; --dark: #101112; --dark-2: #1d1e20; --dark-3: #2a2b2d; --dark-line: #2a2b2d;
  --warn-bg: #3a2e0c; --warn-ink: #ffe3a3; --bad-bg: #3b1613; --bad-ink: #ffc9c3; --pos: #4cc38a; --neg: #ff7a6e;
  --shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
* { box-sizing: border-box; }
body {
  margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 13px; line-height: 1.4; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

/* ---------- app shell ---------- */
.app { display: grid; grid-template-columns: 44px minmax(0, 1fr) 300px; gap: 10px; padding: 10px; min-height: 100vh; }
.rail { background: var(--rail); border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 14px 0; position: sticky; top: 10px; height: calc(100vh - 20px); }
.rail .group { display: flex; flex-direction: column; gap: 8px; align-items: center; }
.rail button { width: 28px; height: 28px; border-radius: 50%; border: 0; background: transparent; color: #aab0b6; display: grid; place-items: center; padding: 0; }
.rail button.active { background: #2a2c2e; color: #fff; }
.rail svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.main { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 10px; min-width: 0; align-items: start; }
.card { background: var(--panel); border-radius: 18px; padding: 16px; min-width: 0; }
.acct h4 { margin: 0; font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: 0.02em; display: flex; justify-content: space-between; }
.big { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; }
.big small { font-size: 18px; color: var(--muted); font-weight: 500; }
.kv { display: flex; justify-content: space-between; padding: 3px 0; color: var(--ink); }
.kv span:first-child { color: var(--ink); }
.sep { height: 1px; background: var(--line); margin: 12px 0; }
.tabs2 { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--line); margin: 10px 0; }
.tabs2 div { text-align: center; padding: 6px 0; color: var(--muted); }
.tabs2 div.on { color: var(--ink); border-bottom: 2px solid var(--ink); font-weight: 500; }
.center { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.chartbox { position: relative; height: 150px; border: 1px dashed var(--line); border-radius: 6px; display: grid; place-items: center; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 25% 25%; }
.chartbox span { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; color: var(--muted); font-size: 11px; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.seg { display: inline-flex; gap: 4px; align-items: center; }
.seg button { border: 0; background: transparent; padding: 5px 10px; border-radius: 8px; color: var(--muted); font-weight: 500; }
.seg button.on { background: var(--ink); color: var(--panel); }
.pill-btn { border: 0; background: var(--chip); border-radius: 8px; padding: 6px 10px; font-weight: 500; }
.search { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; min-width: 150px; color: var(--muted); background: var(--panel); }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 880px; }
th { text-align: left; font-weight: 500; padding: 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
td.num, th.num { text-align: right; }
.empty { text-align: center; color: var(--muted); padding: 28px 0; }
.neg { color: var(--neg); }
.pos { color: var(--pos); }

/* ---------- HTB label ---------- */
.htb { display: inline-flex; align-items: center; height: 18px; padding: 0 8px; border-radius: 9px; background: var(--amber); color: var(--on-amber); font-size: 10.5px; font-weight: 700; white-space: nowrap; letter-spacing: 0.01em; vertical-align: middle; }
.htb.thr { background: transparent; border: 1px solid var(--amber); color: var(--amber); }
.card .htb.thr { color: #8a5d00; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .card .htb.thr { color: var(--amber); } }
:root[data-theme="dark"] .card .htb.thr { color: var(--amber); }
.tier { display: inline-block; padding: 1px 8px; border-radius: 9px; font-size: 11px; font-weight: 600; background: var(--chip); color: var(--muted); }
.tier.t1 { background: #ffe6a8; color: #5a3d00; }
.tier.t2 { background: #ffd0cc; color: #7a1f17; }
.rowlink { border: 0; background: transparent; color: var(--blue); padding: 0; text-decoration: underline; }
.flash { animation: flash 1.2s ease-out 1; }
@keyframes flash { from { background: rgba(242, 169, 0, 0.35); } to { background: transparent; } }
@media (prefers-reduced-motion: reduce) { .flash { animation: none; } }

/* ---------- right symbol panel ---------- */
.side { background: var(--dark); color: var(--on-dark); border-radius: 18px; padding: 16px 14px; display: flex; flex-direction: column; gap: 10px; position: sticky; top: 10px; height: calc(100vh - 20px); overflow-y: auto; border: 1px solid var(--dark-line); }
.symhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; position: relative; }
.symhead .tick { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
.symhead .mag { border: 0; background: transparent; color: var(--on-dark-muted); padding: 2px; display: grid; }
.symhead .mag svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; }
.symname { color: var(--on-dark-muted); font-size: 11px; }
.price { font-size: 38px; font-weight: 600; letter-spacing: -0.02em; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.price small { font-size: 22px; color: var(--on-dark-muted); font-weight: 500; }
.price .chg { font-size: 12px; color: #4cc38a; font-weight: 500; }
.rangebar { height: 3px; border-radius: 2px; background: linear-gradient(90deg, #4cc38a 0 50%, #e5654f 50% 100%); }
.bidask { display: flex; justify-content: space-between; font-size: 11px; color: var(--on-dark-muted); }
.btnrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.dbtn { border: 0; background: var(--dark-3); color: var(--on-dark); border-radius: 10px; padding: 12px 0; font-weight: 600; }
.dbtn:hover:not(:disabled) { background: #3a3b3e; }
.dbtn:disabled { opacity: 0.45; cursor: not-allowed; }
.optchain { display: flex; justify-content: space-between; align-items: center; background: var(--dark-2); border-radius: 10px; padding: 9px 12px; color: var(--on-dark); border: 0; width: 100%; text-align: left; }
.kvd { display: flex; justify-content: space-between; padding: 3px 0; font-size: 12px; }
.kvd span:first-child { color: var(--on-dark-muted); }
.kvd span:last-child { font-weight: 600; }
.borrow { background: var(--dark-2); border-radius: 12px; padding: 10px 12px; font-size: 12px; display: grid; gap: 6px; }
.borrow .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.borrow .row span:first-child { color: var(--on-dark-muted); }
.borrow .note { color: var(--on-dark-muted); font-size: 11px; line-height: 1.35; }
.lock { background: #2a2113; border: 1px solid #5c4513; color: #ffd98a; border-radius: 12px; padding: 10px 12px; font-size: 12px; }
.qa { background: var(--dark-2); border-radius: 14px; padding: 12px; margin-top: auto; }
.qa .hd { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 6px; }
.qa label { font-size: 11px; color: var(--on-dark-muted); display: block; margin-bottom: 4px; }
.qa input[type=number] { width: 100%; background: var(--dark); color: var(--on-dark); border: 1px solid var(--dark-3); border-radius: 8px; padding: 8px 10px; text-align: right; font: inherit; }
.chips { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin: 8px 0; }
.chips button { border: 1px solid var(--dark-3); background: transparent; color: var(--on-dark-muted); border-radius: 6px; padding: 4px 0; font-size: 10.5px; }
.oneTap { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.oneTap button { border: 0; background: var(--dark-3); color: var(--on-dark); border-radius: 6px; padding: 8px 4px; font-size: 11px; font-weight: 600; }
.oneTap button:disabled { opacity: 0.4; cursor: not-allowed; }
.oneTap button:hover:not(:disabled) { background: #3d3e41; }
.pop { position: absolute; top: 34px; left: 0; z-index: 20; width: 270px; background: var(--dark-2); border: 1px solid var(--dark-3); border-radius: 12px; padding: 6px; box-shadow: var(--shadow); }
.pop button { width: 100%; text-align: left; border: 0; background: transparent; color: var(--on-dark); padding: 8px 10px; border-radius: 8px; display: grid; gap: 2px; }
.pop button:hover { background: var(--dark-3); }
.pop .l1 { display: flex; align-items: center; gap: 6px; font-weight: 600; }
.pop .l2 { color: var(--on-dark-muted); font-size: 11px; }

/* ---------- banners & toasts ---------- */
.banner { border-radius: 12px; padding: 10px 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.banner.alert { background: var(--warn-bg); color: var(--warn-ink); }
.banner.crit { background: var(--bad-bg); color: var(--bad-ink); }
.banner .acts { display: flex; gap: 8px; }
.banner button { border: 0; border-radius: 8px; padding: 6px 10px; font-weight: 600; background: rgba(0, 0, 0, 0.12); }
.toasts { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; z-index: 80; display: grid; gap: 8px; width: min(340px, calc(100vw - 24px)); }
.toast { background: #1b1c1e; color: #f2f3f5; border-radius: 16px; padding: 12px 14px; box-shadow: var(--shadow); display: grid; grid-template-columns: 30px 1fr; gap: 10px; border: 1px solid #333; }
.toast .ico { width: 30px; height: 30px; border-radius: 8px; background: var(--amber); color: #141414; display: grid; place-items: center; font-weight: 800; }
.toast .t { font-weight: 600; margin-bottom: 2px; display: flex; justify-content: space-between; gap: 8px; }
.toast .t span { color: #9a9ea4; font-weight: 400; font-size: 11px; }
.toast p { margin: 0; color: #d6d8db; }
.toast .acts { margin-top: 8px; display: flex; gap: 8px; }
.toast .acts button { border: 0; background: #333538; color: #fff; border-radius: 8px; padding: 6px 10px; font-weight: 600; }
.toast.plain { grid-template-columns: 1fr; }

/* ---------- modal ---------- */
.scrim { position: fixed; inset: 0; background: rgba(8, 10, 14, 0.55); z-index: 60; display: grid; place-items: center; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px)); overflow-y: auto; }
.modal { background: var(--panel); color: var(--ink); border-radius: 18px; width: min(460px, 100%); box-shadow: var(--shadow); position: relative; overflow: hidden; }
.modal.wide { width: min(560px, 100%); }
.mhead { padding: 18px 20px 6px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.mhead h3 { margin: 0; font-size: 17px; font-weight: 600; }
.mbody { padding: 8px 20px 18px; display: grid; gap: 12px; }
.mfoot { padding: 14px 20px 18px; display: flex; gap: 10px; justify-content: flex-end; border-top: 1px solid var(--line); }
.x { border: 0; background: var(--chip); border-radius: 50%; width: 26px; height: 26px; line-height: 1; color: var(--muted); }
.btn { border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 600; background: var(--chip); }
.btn.primary { background: var(--ink); color: var(--panel); }
.btn.amber { background: var(--amber); color: var(--on-amber); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fld label { display: block; color: var(--muted); font-size: 11px; margin-bottom: 4px; }
.fld input, .fld select { width: 100%; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 10px; padding: 9px 10px; font: inherit; }
.cost { background: var(--chip); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; }
.cost .r { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.cost .r b { font-size: 15px; }
.cost .f { color: var(--muted); font-size: 11px; }
.timer { border-radius: 10px; background: var(--chip); overflow: hidden; position: relative; height: 34px; display: grid; place-items: center; font-weight: 600; }
.timer i { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(242, 169, 0, 0.35); transition: width 0.25s linear; }
.timer span { position: relative; }
.warnbox { background: var(--warn-bg); color: var(--warn-ink); border-radius: 12px; padding: 10px 12px; font-size: 12px; }
.warnbox ul { margin: 6px 0 0; padding-left: 18px; }
.badbox { background: var(--bad-bg); color: var(--bad-ink); border-radius: 12px; padding: 12px 14px; }
.overlay { position: absolute; inset: 0; background: rgba(15, 16, 18, 0.96); color: #f2f3f5; display: grid; place-content: center; gap: 12px; padding: 24px; text-align: center; z-index: 5; }
.overlay .btn:not(.amber) { background: #2f3032; color: #ffffff; }
.overlay h4 { margin: 0; font-size: 18px; }
.overlay p { margin: 0; color: #c9ccd0; }
.overlay .acts { display: flex; gap: 10px; justify-content: center; margin-top: 4px; }
.changed { background: var(--warn-bg); color: var(--warn-ink); border-radius: 10px; padding: 10px 12px; font-size: 12px; display: grid; gap: 6px; }
.changed label { display: flex; gap: 8px; align-items: center; }
.spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--ink); display: inline-block; animation: spin 0.8s linear infinite; vertical-align: -2px; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
.scroll { max-height: 220px; overflow-y: auto; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 12.5px; }
.scroll ul { margin: 6px 0 10px; padding-left: 18px; }
.scroll li { margin-bottom: 6px; }
.muted { color: var(--muted); }
.small { font-size: 11px; }

/* ---------- prototype controls ---------- */
.ctlbtn { position: fixed; left: calc(66px); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 75; background: var(--ink); color: var(--panel); border: 0; border-radius: 22px; padding: 10px 16px; font-weight: 600; box-shadow: var(--shadow); }
.ctl { position: fixed; left: 66px; bottom: calc(62px + env(safe-area-inset-bottom, 0px)); z-index: 76; width: 330px; max-height: calc(100vh - 110px); overflow-y: auto; background: var(--panel); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); border: 1px solid var(--line); display: grid; gap: 12px; }
.ctl[hidden] { display: none; }
.ctl h5 { margin: 0; font-size: 12px; font-weight: 600; }
.ctl .opts { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.ctl .opts button { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 4px 8px; font-size: 11.5px; }
.ctl .opts button.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.ctl .opts button.go { background: var(--chip); }
.ctl .hint { color: var(--muted); font-size: 11px; margin: 0; }

@media (max-width: 1100px) {
  .app { grid-template-columns: 44px minmax(0, 1fr); }
  .side { position: static; height: auto; grid-column: 1 / -1; }
  .qa { margin-top: 0; }
}
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); padding: 8px; }
  .rail { display: none; }
  .main { grid-template-columns: minmax(0, 1fr); }
  .side { order: -1; }
  .ctlbtn { left: 12px; }
  .ctl { left: 12px; width: calc(100vw - 24px); }
  .grid2 { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <nav class="rail" aria-label="Main navigation">
    <div class="group">
      <button class="active" aria-label="Home" title="Home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg></button>
      <button aria-label="Portfolio" title="Portfolio"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></button>
      <button aria-label="Research" title="Research"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6"/></svg></button>
      <button aria-label="Trade" title="Trade"><svg viewBox="0 0 24 24"><path d="M4 7h10M4 17h16M14 4l3 3-3 3M10 14l-3 3 3 3"/></svg></button>
      <button aria-label="Orders" title="Orders"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg></button>
      <button aria-label="Launch" title="Launch"><svg viewBox="0 0 24 24"><path d="M5 19c1-4 4-7 8-9 2-1 5-1 6-1 0 1 0 4-1 6-2 4-5 7-9 8zM9 15l-4 4"/></svg></button>
    </div>
    <div class="group">
      <button aria-label="Support" title="Support"><svg viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 0 1 16 0v2M4 14h3v5H4zM17 14h3v5h-3z"/></svg></button>
      <button aria-label="Account" title="Account"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg></button>
      <button aria-label="Sign out" title="Sign out"><svg viewBox="0 0 24 24"><path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4M16 8l4 4-4 4M20 12H9"/></svg></button>
    </div>
  </nav>

  <div class="main">
    <aside class="card acct" id="acct" aria-label="Account summary"></aside>
    <section class="center" id="center"></section>
  </div>

  <aside class="side" id="side" aria-label="Symbol panel"></aside>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="modalRoot"></div>
<button class="ctlbtn" id="ctlBtn" aria-expanded="false">Prototype controls</button>
<div class="ctl" id="ctl" hidden></div>

<script>
(function () {
  "use strict";

  /* ---------- demo data ---------- */
  var SYMS = {

  }
  function stale() { return S.demo.data === "stale"; }
  function renderTicket(focusFirst) {
    var t = S.ticket; if (!t) return; var s = SYMS[t.sym];
    var px = t.type === "Market" ? s.ask : (+t.limit || s.price);
    var est = charge(t.qty, px, t.rate);
    var left = Math.max(0, Math.ceil((t.expiresAt - Date.now()) / 1000));
    var checking = t.status === "checking";
    var costHtml;
    if (stale()) costHtml = '<div class="badbox"><b>Current rate unavailable.</b> Borrow data for ' + t.sym + ' is out of date, so we can’t show a rate. New hard-to-borrow shorts in this name are blocked until it refreshes.</div>';
    else if (checking) costHtml = '<div class="cost"><div class="r"><span><span class="spinner"></span>Checking borrow…</span></div></div>';
    else costHtml = '<div class="cost"><div class="r"><span>Current rate</span><b>' + fmt(t.rate, 1) + '% annualized</b></div><div class="r"><span>Estimated overnight charge</span><b>' + money(est) + '</b></div><div class="f">' + fmt(t.qty, 0) + " shares &times; $" + fmt(px) + " &times; " + fmt(t.rate, 1) + "% &divide; 360. A short opened and covered the same day has no borrow charge.</div></div>";
    var timerHtml = (stale() || checking) ? "" : '<div class="timer" role="timer"><i style="width:' + Math.min(100, (left / S.demo.timer) * 100) + '%"></i><span>Rate shown as current for ' + Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0") + "</span></div>";
    var changed = t.needConfirm ? '<div class="changed"><div><b>The rate changed:</b> ' + fmt(t.prevRate, 1) + "% &rarr; " + fmt(t.rate, 1) + '%</div><label><input type="checkbox" id="chgChk" ' + (t.confirmed ? "checked" : "") + '> I’ve seen the new rate</label></div>' : "";
    var canSubmit = !stale() && !checking && !t.expired && (!t.needConfirm || t.confirmed);
    var html = '<div class="mhead"><div><h3>Sell short ' + t.sym + " " + htbLabel(t.sym) + '</h3><div class="muted small">Last $' + fmt(s.price) + " &bull; Bid " + fmt(s.bid) + " &bull; Ask " + fmt(s.ask) + '</div></div><button class="x" aria-label="Cancel order" data-cancel>&times;</button></div>' +
      '<div class="mbody"><div class="grid2"><div class="fld"><label for="tQty">Quantity</label><input id="tQty" type="number" min="1" value="' + t.qty + '"></div>' +
      '<div class="fld"><label for="tType">Order type</label><select id="tType">' + ["Market", "Limit", "Stop", "Stop limit", "Trailing stop"].map(function (o) { return "<option" + (o === t.type ? " selected" : "") + ">" + o + "</option>"; }).join("") + "</select></div>" +
      (t.type !== "Market" && t.type !== "Trailing stop" ? '<div class="fld"><label for="tLim">' + (t.type === "Limit" ? "Limit price" : "Price") + '</label><input id="tLim" type="number" step="0.01" value="' + t.limit + '"></div>' : "") +
      '<div class="fld"><label for="tTif">Time in force</label><select id="tTif">' + ["Day", "IOC", "FOK", "At the close", "GTC", "GTD"].map(function (o) { return "<option" + (o === t.tif ? " selected" : "") + ">" + o + "</option>"; }).join("") + "</select></div>" +
      '<div class="fld"><label for="tSes">Session</label><select id="tSes"><option value="ext"' + (t.session === "ext" ? " selected" : "") + '>Extended: 4 AM to 8 PM ET</option><option value="on"' + (t.session === "on" ? " selected" : "") + ">Overnight</option></select></div></div>" +
      costHtml + timerHtml + changed +
      '<div class="warnbox"><b>Before you submit</b><ul><li>Losses on a short are theoretically unlimited.</li><li>This is the current rate. It can change at any time, even right after you submit.</li><li>Shares can be recalled, which can force a buy-in.</li>' + (s.thr ? "<li>This stock is on the Reg SHO threshold list, which carries a higher risk of being bought in.</li>" : "") + "</ul></div></div>" +
      '<div class="mfoot"><button class="btn" data-cancel>Cancel</button><button class="btn primary" id="tSubmit"' + (canSubmit ? "" : " disabled") + ">Submit short</button></div>" +
      (t.expired ? '<div class="overlay" role="alertdialog" aria-label="Rate timer expired"><h4>Timer expired</h4><p>The rate may have changed. Refresh the rate to continue, or cancel the order.</p><div class="acts"><button class="btn amber" id="tRefresh">Refresh rate</button><button class="btn" data-cancel>Cancel order</button></div></div>' : "");
    var keepFocus = document.activeElement && document.activeElement.id;
    openModal(html, true, function (m) {
      m.querySelectorAll("[data-cancel]").forEach(function (b) { b.onclick = function () { addOrder("Sell short", t.sym, t.qty, t.type, t.tif, "Canceled"); closeModal(); renderCenter(); }; });
      var bind = function (id, key, num) { var el = m.querySelector("#" + id); if (!el) return; el.onchange = function () { t[key] = num ? (+el.value || 1) : el.value; onTicketChange(); }; };
      bind("tQty", "qty", true); bind("tType", "type"); bind("tLim", "limit", true); bind("tTif", "tif"); bind("tSes", "session");
      var chk = m.querySelector("#chgChk"); if (chk) chk.onchange = function () { t.confirmed = chk.checked; renderTicket(); };
      var rf = m.querySelector("#tRefresh"); if (rf) rf.onclick = refreshRate;
      var sub = m.querySelector("#tSubmit"); if (sub) sub.onclick = submitTicket;
      if (keepFocus && !focusFirst) { var f = m.querySelector("#" + keepFocus); if (f && f.focus) f.focus(); }
    });
  }
  function onTicketChange() {
    var t = S.ticket; t.status = "checking"; t.expired = false; renderTicket();
    setTimeout(function () {
      if (!S.ticket) return;
      t.status = "live"; t.needConfirm = false; t.confirmed = true; t.expiresAt = Date.now() + S.demo.timer * 1000; renderTicket();
    }, 700);
  }
  function refreshRate() {
    var t = S.ticket, s = SYMS[t.sym]; t.status = "checking"; t.expired = false; renderTicket();
    setTimeout(function () {
      if (!S.ticket) return;
      var old = t.rate;
      if (S.demo.drift) { s.rate = Math.round((s.rate + (s.thr ? 9 : 3.5)) * 10) / 10; }
      t.rate = s.rate;
      renderSide(); t.status = "live"; t.prevRate = old; t.needConfirm = t.rate !== old; t.confirmed = !t.needConfirm;
      t.expiresAt = Date.now() + S.demo.timer * 1000; renderTicket();
    }, 700);
  }
  function startTick() {
    stopTick();
    S.tick = setInterval(function () {
      var t = S.ticket; if (!t || t.status === "checking" || stale()) return;
      if (!t.expired && Date.now() >= t.expiresAt) { t.expired = true; renderTicket(); return; }
      if (!t.expired) {
        var left = Math.max(0, Math.ceil((t.expiresAt - Date.now()) / 1000)), bar = document.querySelector(".timer i"), lab = document.querySelector(".timer span");
        if (bar) bar.style.width = Math.min(100, (left / S.demo.timer) * 100) + "%";
        if (lab) lab.textContent = "Rate shown as current for " + Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0");
      }
    }, 250);
  }
  function stopTick() { if (S.tick) { clearInterval(S.tick); S.tick = null; } }

  function submitTicket() {
    var t = S.ticket, s = SYMS[t.sym];
    var btn = $("tSubmit"); if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Checking borrow…'; }
    setTimeout(function () {
      if (!S.ticket) return;
      var reason = null, title = "Order rejected";
      if (t.type === "Trailing stop") reason = "Trailing stop orders aren’t supported for hard-to-borrow shorts. Use a Market or Limit order.";
      else if (t.type === "Stop limit" && t.session === "ext") reason = "Extended-hours stop limit orders aren’t supported for hard-to-borrow shorts. Use a Limit order.";
      else if (t.tif === "GTC" || t.tif === "GTD") reason = t.tif + " orders aren’t accepted for hard-to-borrow shorts because borrow is confirmed one trading day at a time. Use a Day order.";
      else if (t.session === "on") reason = "Hard-to-borrow shorts can’t be placed in the overnight session. You can place them from 4:00 AM to 8:00 PM ET.";
      else if (S.demo.long && t.qty > 100) { title = "One order can’t flip your position"; reason = "You hold 100 shares long in " + t.sym + ". Sell your long first, then short in a separate order."; }
      else {
        var avail = S.demo.avail === "none" ? 0 : S.demo.avail === "partial" ? Math.floor(t.qty * 0.4) : Math.max(s.avail, t.qty);
        if (avail < t.qty) { title = "Not enough shares to borrow"; reason = "We could borrow " + fmt(avail, 0) + " of the " + fmt(t.qty, 0) + " shares you asked for. The whole order was rejected; we don’t borrow part of an order."; }
      }
      if (reason) { var q = t.qty, ty = t.type, tf = t.tif; addOrder("Sell short", t.sym, q, ty, tf, "Rejected", title); closeModal(); rejectModal(t.sym, q, title, reason, false); renderCenter(); return; }
      var px = t.type === "Market" ? s.ask : (+t.limit || s.price);
      S.positions.push({ sym: t.sym, qty: -t.qty, avg: px, rate: t.rate, openRate: t.rate, tier: 0, flash: true });
      addOrder("Sell short", t.sym, t.qty, t.type, t.tif, "Accepted");
      closeModal(); renderAll();
      toast("Short order accepted", "Sold short " + fmt(t.qty, 0) + " " + t.sym + ". Rate shown: " + fmt(t.rate, 1) + "%. It can change at any time, even right after submit.", null, true);
    }, 900);
  }

  function rejectModal(sym, qty, title, reason, notShortable) {
    openModal('<div class="mhead"><h3>' + esc(title) + '</h3><button class="x" aria-label="Close" data-close>&times;</button></div><div class="mbody"><div class="badbox">' + esc(reason) + "</div>" +
      (notShortable ? "" : '<p class="muted small" style="margin:0">Rejected orders aren’t charged. Nothing was borrowed.</p>') + "</div>" +
      '<div class="mfoot"><button class="btn" id="notify">Notify me when available</button><button class="btn primary" data-close>' + (notShortable ? "Close" : "Edit order") + "</button></div>", false, function (m) {
        bindClose(m);
        m.querySelector("#notify").onclick = function () { closeModal(); toast("We’ll tell you", "You’ll get a notification when " + sym + " has shares available to short.", null, true); };
        if (!notShortable) m.querySelector(".btn.primary").onclick = function () { closeModal(); openTicket(sym, qty, "Market"); };
      });
  }

  function coverModal(sym) {
    var p = S.positions.filter(function (x) { return x.sym === sym; })[0]; if (!p) return;
    openModal('<div class="mhead"><h3>Close short ' + sym + '</h3><button class="x" aria-label="Close" data-close>&times;</button></div><div class="mbody"><p style="margin:0">Buy ' + fmt(Math.abs(p.qty), 0) + " " + sym + " at market to close this short. A same-day close has no borrow charge; borrow charges stop after the closing trade settles.</p></div>" +
      '<div class="mfoot"><button class="btn" data-close>Keep position</button><button class="btn primary" id="cover">Buy to close</button></div>', false, function (m) {
        bindClose(m);
        m.querySelector("#cover").onclick = function () {
          addOrder("Buy to cover", sym, Math.abs(p.qty), "Market", "Day", "Accepted");
          S.positions = S.positions.filter(function (x) { return x !== p; });
          S.banners = S.banners.filter(function (b) { return b.sym !== sym; });
          closeModal(); renderAll(); toast("Position closed", "Bought " + fmt(Math.abs(p.qty), 0) + " " + sym + " to cover.", null, true);
        };
      });
  }
  function whyModal(i) {
    var l = S.ledger[i]; if (!l) return;
    openModal('<div class="mhead"><h3>Why was I charged?</h3><button class="x" aria-label="Close" data-close>&times;</button></div><div class="mbody"><p style="margin:0">You were short ' + fmt(l.shares, 0) + " shares of <b>" + l.sym + "</b> overnight on " + l.date + ". Hard-to-borrow shorts pay a daily borrow fee.</p>" +
      '<div class="cost"><div class="r"><span>Shares</span><b>' + fmt(l.shares, 0) + '</b></div><div class="r"><span>Price</span><b>' + money(l.price) + '</b></div><div class="r"><span>Borrow rate that day</span><b>' + fmt(l.rate, 1) + '% annualized</b></div><div class="r"><span>Charge</span><b>' + money(l.charge) + '</b></div><div class="f">' + fmt(l.shares, 0) + " &times; $" + fmt(l.price) + " &times; " + fmt(l.rate, 1) + "% &divide; 360 = " + money(l.charge) + "</div></div>" +
      '<p class="muted small" style="margin:0">' + esc(l.note) + "</p></div><div class=\"mfoot\"><button class=\"btn primary\" data-close>Close</button></div>", false, bindClose);
  }

  /* ---------- simulations ---------- */
  function ensurePosition(sym) {
    var p = S.positions.filter(function (x) { return x.sym === sym; })[0];
    if (!p) { var s = SYMS[sym]; p = { sym: sym, qty: -1000, avg: s.price - 0.2, rate: s.rate, openRate: s.rate, tier: 0, flash: true }; S.positions.push(p); }
    return p;
  }
  function simRateUp() {
    var p = S.positions.filter(function (x) { return SYMS[x.sym].status === "HTB"; })[0] || ensurePosition("ZRXT");
    var s = SYMS[p.sym], old = p.rate, add = p.tier === 0 ? 36 : 60;
    p.rate = Math.round((old + add) * 10) / 10; s.rate = p.rate; p.tier = Math.min(2, p.tier + 1); p.flash = true;
    var oc = charge(p.qty, s.price, old), nc = charge(p.qty, s.price, p.rate);
    var body = "<b>" + p.sym + "</b> borrow rate rose from " + fmt(old, 1) + "% to " + fmt(p.rate, 1) + "%. Estimated overnight charge on your short: " + money(nc) + " (was " + money(oc) + ").";
    S.banners.unshift({ kind: p.tier === 2 ? "crit" : "alert", sym: p.sym, html: "<b>Rate alert.</b> " + body });
    toast("Rate alert: " + p.sym, body, [{ label: "Close or reduce", fn: function () { coverModal(p.sym); } }, { label: "Dismiss", fn: function () {} }]);
    S.tab = "positions"; renderAll();
  }
  function simRecall() {
    var p = S.positions.filter(function (x) { return x.sym === "KLMN"; })[0] || ensurePosition("KLMN");
    p.tier = 2; p.flash = true;
    S.banners.unshift({ kind: "crit", sym: p.sym, html: "<b>Recall notice.</b> Shares for " + p.sym + " are no longer available to borrow. Close your short before the next market open to avoid a buy-in." });
    toast("Recall notice: " + p.sym, "Shares are no longer available to borrow. Close your short before the next market open to avoid a buy-in.", [{ label: "Close or reduce", fn: function () { coverModal(p.sym); } }]);
    S.tab = "positions"; renderAll();
  }
  function simOvernight() {
    var any = false;
    S.positions.forEach(function (p) {
      var s = SYMS[p.sym]; if (s.status !== "HTB") return; any = true;
      var c = charge(p.qty, s.price, p.rate);
      S.ledger.push({ date: today(S.ledger.length), sym: p.sym, shares: Math.abs(p.qty), price: s.price, rate: p.rate, charge: c, note: p.rate !== p.openRate ? "The rate changed from " + fmt(p.openRate, 1) + "% when you opened the short to " + fmt(p.rate, 1) + "%. Charges use the rate in effect for the day." : "The rate stayed at " + fmt(p.rate, 1) + "% since you opened the short." });
    });
    if (!any) { ensurePosition("ZRXT"); simOvernight(); return; }
    S.tab = "ledger"; renderAll();
  }

  /* ---------- prototype controls ---------- */
  function renderCtl() {
    function opts(key, list) { return '<div class="opts">' + list.map(function (o) { return '<button data-k="' + key + '" data-v="' + o[0] + '" class="' + (String(S.demo[key]) === String(o[0]) ? "on" : "") + '">' + o[1] + "</button>"; }).join("") + "</div>"; }
    $("ctl").innerHTML =
      '<div><h5>Jump to a screen</h5><div class="opts">' +
      [["1", "1 Stock page and label"], ["2", "2 Risk acknowledgment"], ["3", "3 Order ticket"], ["4", "4 Position and ledger"], ["5", "5 Rate alert"], ["6", "6 Timer expired"], ["7a", "7 Not enough shares"], ["7b", "7 GTC rejected"], ["7c", "7 Overnight rejected"], ["7d", "7 Recall"], ["7e", "7 Acknowledgment expired"], ["7f", "7 Not eligible"]].map(function (j) { return '<button class="go" data-jump="' + j[0] + '">' + j[1] + "</button>"; }).join("") + "</div></div>" +
      "<div><h5>Account eligibility</h5>" + opts("eligible", [[true, "Eligible"], [false, "Not eligible"]]) + "</div>" +
      "<div><h5>Risk acknowledgment</h5>" + opts("ack", [["none", "Not signed"], ["current", "Current"], ["expiring", "Expiring"], ["expired", "Expired"]]) + "</div>" +
      "<div><h5>Shares available to borrow</h5>" + opts("avail", [["full", "Full"], ["partial", "Partial"], ["none", "None"]]) + "</div>" +
      "<div><h5>Borrow rate data</h5>" + opts("data", [["fresh", "Fresh"], ["stale", "Stale"]]) + "</div>" +
      "<div><h5>Rate timer</h5>" + opts("timer", [[8, "8 sec"], [20, "20 sec"], [45, "45 sec"]]) + "</div>" +
      "<div><h5>Rate moves on refresh</h5>" + opts("drift", [[true, "Yes"], [false, "No"]]) + "</div>" +
      "<div><h5>Existing long position</h5>" + opts("long", [[false, "None"], [true, "100 shares"]]) + "</div>" +
      '<div><h5>Simulate</h5><div class="opts"><button class="go" data-sim="up">Rate increase alert</button><button class="go" data-sim="recall">Recall notice</button><button class="go" data-sim="night">Overnight accrual</button><button class="go" data-sim="reset">Reset demo</button></div></div>' +
      '<p class="hint">Demo data and fictional tickers except SPY. Controls change the scenario; they aren’t part of the product.</p>';
  }
  $("ctlBtn").onclick = function () { S.ctlOpen = !S.ctlOpen; $("ctl").hidden = !S.ctlOpen; $("ctlBtn").setAttribute("aria-expanded", S.ctlOpen); if (S.ctlOpen) renderCtl(); };
  $("ctl").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    if (b.dataset.k) { var v = b.dataset.v; S.demo[b.dataset.k] = v === "true" ? true : v === "false" ? false : (b.dataset.k === "timer" ? +v : v); if (b.dataset.k === "ack" && v !== "none") S.ackAt = new Date(); renderCtl(); renderAll(); return; }
    if (b.dataset.sim) { var k = b.dataset.sim; if (k === "up") simRateUp(); if (k === "recall") simRecall(); if (k === "night") simOvernight(); if (k === "reset") resetDemo(); renderCtl(); return; }
    if (b.dataset.jump) jump(b.dataset.jump);
  });
  function resetDemo() {
    SYMS.ZRXT.rate = 42.0; SYMS.KLMN.rate = 118.0;
    S.positions = []; S.orders = []; S.ledger = []; S.banners = []; S.tab = "positions"; S.sym = "ZRXT"; S.qty = 10;
    S.demo = { eligible: true, ack: "none", avail: "full", data: "fresh", timer: 20, drift: true, long: false };
    closeModal(); renderAll();
  }
  function jump(k) {
    closeModal(); $("toasts").innerHTML = "";
    S.ctlOpen = false; $("ctl").hidden = true; $("ctlBtn").setAttribute("aria-expanded", "false");
    S.demo.eligible = true; S.demo.data = "fresh"; S.demo.long = false; S.demo.avail = "full";
    SYMS.ZRXT.rate = 42.0; SYMS.KLMN.rate = 118.0;
    if (k === "1") { S.sym = "ZRXT"; S.popOpen = true; S.positions = []; renderAll(); return; }
    if (k === "2") { S.sym = "ZRXT"; S.demo.ack = "none"; renderAll(); startShort("ZRXT", 1000, "Market"); return; }
    if (k === "3") { S.sym = "ZRXT"; S.demo.ack = "current"; renderAll(); openTicket("ZRXT", 1000, "Market"); return; }
    if (k === "4") { S.positions = []; S.ledger = []; S.banners = []; ensurePosition("ZRXT"); S.sym = "ZRXT"; S.demo.ack = "current"; simOvernight(); return; }
    if (k === "5") { S.positions = []; S.banners = []; ensurePosition("ZRXT"); S.sym = "ZRXT"; S.demo.ack = "current"; simRateUp(); return; }
    if (k === "6") { S.sym = "ZRXT"; S.demo.ack = "current"; renderAll(); openTicket("ZRXT", 1000, "Market"); S.ticket.expiresAt = Date.now() - 1; S.ticket.expired = true; renderTicket(); return; }
    if (k === "7a") { S.sym = "KLMN"; S.demo.ack = "current"; S.demo.avail = "partial"; renderAll(); openTicket("KLMN", 5000, "Market"); submitTicket(); return; }
    if (k === "7b") { S.sym = "ZRXT"; S.demo.ack = "current"; renderAll(); openTicket("ZRXT", 1000, "Limit"); S.ticket.tif = "GTC"; submitTicket(); return; }
    if (k === "7c") { S.sym = "ZRXT"; S.demo.ack = "current"; renderAll(); openTicket("ZRXT", 1000, "Market"); S.ticket.session = "on"; submitTicket(); return; }
    if (k === "7d") { S.positions = []; S.banners = []; S.demo.ack = "current"; S.sym = "KLMN"; ensurePosition("KLMN"); simRecall(); return; }
    if (k === "7e") { S.sym = "ZRXT"; S.demo.ack = "expired"; renderAll(); startShort("ZRXT", 1000, "Market"); return; }
    if (k === "7f") { S.sym = "ZRXT"; S.demo.eligible = false; renderAll(); startShort("ZRXT", 1000, "Market"); return; }
  }

  function renderAll() { renderAcct(); renderCenter(); renderSide(); if (S.ctlOpen) renderCtl(); }
  renderAll();
})();
</script>
</body>
</html>
